<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokyudex — Binders</title>
  <link rel="stylesheet" href="style.css" />
  <style>:root { --dot-color: #4f8bf9; }</style>
  <style>
    .binder-shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin: 24px 0 10px;
    }
    .binder-cover-card {
      position: relative;
      border-radius: 14px;
      padding: 20px 16px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      border: 6px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .binder-cover-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.55);
    }
    .binder-cover-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.5) 100%);
    }
    .binder-cover-spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: rgba(0,0,0,0.35);
    }
    .binder-cover-name {
      position: relative;
      z-index: 1;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      line-height: 1.2;
    }
    .binder-cover-meta {
      position: relative;
      z-index: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .binder-cover-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }
    .binder-cover-actions button {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .binder-cover-actions button:hover { background: rgba(0,0,0,0.75); }
    .binder-cover-card.empty-state {
      align-items: center;
      justify-content: center;
      cursor: default;
      border-style: dashed;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .binder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
    .creator-panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); margin-bottom: 30px; }
    .form-group { display: inline-flex; flex-direction: column; margin-right: 14px; margin-bottom: 10px; }
    .form-group label { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; }
    .binder-tab-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,9,14,0.95); z-index: 1100; padding: 40px; overflow-y: auto; }
    
    .binder-book-spread {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      padding: 24px;
      border-radius: 20px;
      margin: 24px auto;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      position: relative;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    #binder-view-wrapper {
      width: 100vw;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      box-sizing: border-box;
      padding: 0 24px;
    }
    
    .binder-page-side { display: flex; flex-direction: column; flex-shrink: 0; }
    .binder-spine {
      width: 24px;
      margin: 0 12px;
      flex-shrink: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.55), rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.03) 70%, rgba(0,0,0,0.55));
      border-left: 1px solid rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.02);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      border-radius: 4px;
    }
    .page-title-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      background: rgba(6, 5, 9, 0.88);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .slot-remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(20, 18, 26, 0.85);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 10px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    .slot-remove-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
      transform: scale(1.05);
    }

    .binder-slot-blank {
      cursor: default;
      background: transparent;
      border: none;
    }
    .binder-slot-blank:hover {
      transform: none;
      box-shadow: none;
      border-color: transparent;
      background: transparent;
    }

    .binder-slot[draggable="true"]:active { cursor: grabbing; }
    .binder-slot[draggable="true"]:hover img { filter: brightness(1.08); }
    .binder-slot img { transition: filter 0.15s ease; }

    #card-modal {
      z-index: 2000;
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    #card-modal.active { display: flex; }
    #card-modal .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 7, 12, 0.92);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.25s ease;
      cursor: zoom-out;
    }
    #card-modal.active .modal-backdrop { opacity: 1; }

    .modal-card-frame {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.85);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.22s ease;
      max-width: 90vw;
    }
    #card-modal.active .modal-card-frame { transform: scale(1); opacity: 1; }

    .modal-card-frame .modal-content {
      max-height: 76vh;
      max-width: 90vw;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      display: block;
    }

    .modal-card-info { text-align: center; margin-top: 16px; }
    .modal-card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .modal-card-price {
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold);
      font-size: 14px;
      margin-top: 4px;
    }

    .modal-close {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--panel, #1c1a25);
      border: 1px solid var(--border, #333);
      color: var(--text, #fff);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .modal-close:hover { background: var(--danger, #e5484d); color: #fff; border-color: var(--danger, #e5484d); }

    .crop-viewport-box {
      position: relative;
      overflow: hidden;
      border: 2px dashed var(--border);
      border-radius: 8px;
      background: #09080d;
      cursor: move;
      user-select: none;
      touch-action: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: width 0.2s ease, height 0.2s ease;
    }
  </style>
</head>
<body>

    <div class="topbar-left">
      <div class="side-menu-trigger">
        <button class="hamburger-btn" aria-label="Menu">☰</button>
        <div class="side-menu-panel">
          <a href="binder.html" class="side-menu-link">📁 Binders</a>
          <a href="wishlist.html" class="side-menu-link">❤️ Wishlist</a>
          <a href="collezione.html" class="side-menu-link">★ My Collection</a>
        </div>
      </div>
      <a href="index.html" class="icon-btn" aria-label="Home" title="Home">🏠</a>

  <div class="container">
    <div class="eyebrow">Visual Display</div>

    <div class="creator-panel">
      <div class="eyebrow" style="color: var(--gold)">New Project</div>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end;">
        <div class="form-group">
          <label>Binder Name</label>

        </div>
        <div class="form-group">
          <label>Layout Type</label>

          <div class="form-group">

          </div>

          <input type="color" id="b-panel-color" value="#16141d" style="width: 70px; padding:2px; height:37px;" />

    <div class="binder-shelf" id="binder-shelf"></div>

    <hr style="border-color: var(--border); margin: 30px 0; display: none;" id="active-hr">

    <div id="active-binder-view" style="display: none;">
      <div class="binder-header">
        <div>
          <button class="btn" onclick="closeActiveBinder()" style="margin-bottom:10px;">&larr; All Binders</button><br>
          <h2 id="active-title" style="margin:0; font-family:'Rajdhani'; font-size:30px; display:inline-block;"></h2>
          <button class="icon-btn" title="Edit binder" onclick="openEditBinderModal(currentBinderId)" style="width:30px; height:30px; font-size:13px; vertical-align:middle; margin-left:8px;">✎</button>
          <div id="active-meta" class="eyebrow" style="margin-top:4px;"></div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="chip active" id="view-single-btn" style="margin:0;">Single Page</div>
          <div class="chip" id="view-book-btn" style="margin:0;">Book View (2 Pages)</div>

        <div>
          <button class="btn" id="nav-prev">&larr; Previous</button>
          <span id="page-indicator" style="font-family:'JetBrains Mono'; font-size:14px; margin:0 12px; color: var(--gold); font-weight:700;">Page 1</span>
          <button class="btn" id="nav-next">Next &rarr;</button>

  <div id="edit-binder-modal" class="modal" onclick="closeEditBinderModal()">

        <div class="form-group" style="margin:0;">

          <input type="color" id="edit-b-color" style="width: 70px; padding:2px; height:37px;" />

        <div class="form-group" style="margin:0;">

          <input type="color" id="edit-b-inner-color" style="width: 70px; padding:2px; height:37px;" />

        <div class="form-group" style="margin:0;">
          <label>Grid Panel</label>

        </div>
      </div>
      <button class="btn btn-accent" style="width:100%;" onclick="saveEditBinder()">Save Changes</button>

  <div id="search-overlay" class="search-overlay">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Select the item to place in Slot <span id="target-slot-title"></span></h2>
        <button class="btn" onclick="closeSearchOverlay()">Close</button>
      </div>

      <div style="background: var(--panel); border: 1px solid var(--border); padding: 22px; border-radius: var(--radius); margin-bottom: 28px;">
        <h3 style="margin: 0 0 14px 0; font-family: 'Rajdhani'; font-size: 20px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px;">🖼️ Upload Custom Image or Divider</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">

                <option value="1">Standard Size (1x1)</option>
                <option value="2">Horizontal Extended (2x1 Spanning)</option>

              </select>
            </div>
            <button class="btn btn-accent" id="upload-confirm-btn" onclick="uploadCustomImageSlot()" style="height: 40px; width: 100%; display: none;">Crop & Upload Item</button>
          </div>
          
          <div id="cropper-ui-container" style="display: none; flex-direction: column; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 14px; border-radius: 8px; border: 1px solid var(--border);">
            <div id="crop-viewport" class="crop-viewport-box">

            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
              <span style="font-family:'JetBrains Mono'; font-size: 11px; color: var(--text-muted);">ZOOM:</span>
              <input type="range" id="crop-zoom-slider" min="1" max="4" step="0.01" value="1" style="flex: 1;" />
            </div>
          </div>

      </div>

      <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--text-muted); text-transform: uppercase; margin-bottom: 10px;">Or Search TCG Database</div>
      <input type="text" class="search-bar" id="modal-card-search" placeholder="Type the Pokémon name..." style="max-width:100%; margin-top: 0; margin-bottom:10px;" />
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <select id="modal-rarity-select" class="search-bar" style="margin-top:0; width:auto; min-width:200px; height:41px; padding:0 14px;">
          <option value="">-- Any Rarity --</option>
        </select>
        <select id="modal-type-select" class="search-bar" style="margin-top:0; width:auto; min-width:160px; height:41px; padding:0 14px;">
          <option value="">-- Any Type --</option>
        </select>

  <div id="card-modal" class="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-card-frame">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <img class="modal-content" id="modal-img" src="" alt="Enlarged item" />
      <div class="modal-card-info">
        <div class="modal-card-name" id="modal-card-name"></div>
        <div class="modal-card-price" id="modal-card-price"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const DEFAULT_BINDER_PALETTE = [
      { h: 217, s: 78, l: 62 },
      { h: 195, s: 70, l: 60 },
      { h: 240, s: 62, l: 50 },
    ];
    const DEFAULT_BINDER_DOT_COLOR = '#4f8bf9';
    renderBloomLayer(DEFAULT_BINDER_PALETTE);

    function hexToRgba(hex, alpha) {
      const c = (hex || '#f0b93d').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) || 0;
      const g = parseInt(c.substring(2, 4), 16) || 0;
      const b = parseInt(c.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function hexToHsl(hex) {
      const c = (hex || '#4f8bf9').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) / 255;
      const g = parseInt(c.substring(2, 4), 16) / 255;
      const b = parseInt(c.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
          case r: h = ((g - b) / d) % 6; break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function applyBinderTheme(b) {
      const coverHsl = hexToHsl(b.color);
      const innerHsl = hexToHsl(b.inner_color || b.color);
      const panelHsl = hexToHsl(b.panel_color || '#16141d');
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const dotColor = `hsl(${coverHsl.h}, ${clamp(coverHsl.s + 10, 0, 100)}%, ${clamp(coverHsl.l + 8, 25, 78)}%)`;
      document.documentElement.style.setProperty('--dot-color', dotColor);
      renderBloomLayer([coverHsl, innerHsl, panelHsl]);
    }

    function resetBinderTheme() {
      document.documentElement.style.setProperty('--dot-color', DEFAULT_BINDER_DOT_COLOR);
      renderBloomLayer(DEFAULT_BINDER_PALETTE);
    }

    let binders = [];
    let currentBinderId = null;
    let currentBinderData = null;
    let currentPage = 1; 
    let viewMode = 'single'; 
    let targetSlotNumber = null;

    const viewSingleBtn = document.getElementById('view-single-btn');
    const viewBookBtn = document.getElementById('view-book-btn');

    viewSingleBtn.addEventListener('click', () => {
      viewSingleBtn.className = 'chip active';
      viewBookBtn.className = 'chip';
      viewMode = 'single';
      renderActiveGrid();
    });

    viewBookBtn.addEventListener('click', () => {
      viewBookBtn.className = 'chip active';
      viewSingleBtn.className = 'chip';
      viewMode = 'book';
      if (currentPage > 1 && currentPage % 2 !== 0) { currentPage--; }
      renderActiveGrid();
    });

    let editingBinderId = null;

    async function loadBinders() {
      binders = await api('/api/binders');
      renderBinderShelf();
    }

    function renderBinderShelf() {
      const shelf = document.getElementById('binder-shelf');
      shelf.innerHTML = '';
      if (!binders.length) {
        const empty = document.createElement('div');
        empty.className = 'binder-cover-card empty-state';
        empty.textContent = 'No binders yet — create one above!';
        shelf.appendChild(empty);
        return;
      }
      binders.forEach(b => {
        const card = document.createElement('div');
        card.className = 'binder-cover-card';
        card.style.background = `linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.55) 100%), ${b.color}`;
        card.onclick = () => openBinder(b.id);
        card.innerHTML = `
          <div class="binder-cover-spine"></div>
          <div class="binder-cover-actions">
            <button title="Edit" onclick="event.stopPropagation(); openEditBinderModal(${b.id})">✎</button>

    function getSlotsCovered(slotNum, span, numCols, numRows) {
      const slotsPerPage = numCols * numRows;
      const pageStart = Math.floor((slotNum - 1) / slotsPerPage) * slotsPerPage;
      const localIdx = (slotNum - 1) % slotsPerPage;
      const row = Math.floor(localIdx / numCols);
      const col = localIdx % numCols;

      if (span === 1 || !span) {
        return [slotNum];
      }
      if (span === 2) { 
        if (col + 1 >= numCols) return null; 
        return [slotNum, slotNum + 1];
      }
      if (span === 3) { 
        if (col + 1 >= numCols || row + 1 >= numRows) return null; 
        return [slotNum, slotNum + 1, slotNum + numCols, slotNum + numCols + 1];
      }
      return null;
    }

    function checkBinderValidity(slotsCopy, numCols, numRows) {
      let occupancy = {};
      for (let sNum in slotsCopy) {
        let card = slotsCopy[sNum];
        if (!card) continue;
        let start = parseInt(sNum);
        let covered = getSlotsCovered(start, card.slot_span || 1, numCols, numRows);
        if (covered === null) return false; 
        for (let slot of covered) {
          if (occupancy[slot] !== undefined) return false; 
          occupancy[slot] = start;
        }
      }
      return true;
    }

    function adjustSlotForSpan(slotNum, span, numCols, numRows) {
      const slotsPerPage = numCols * numRows;
      let pageStart = Math.floor((slotNum - 1) / slotsPerPage) * slotsPerPage;
      let localIdx = (slotNum - 1) % slotsPerPage;
      let row = Math.floor(localIdx / numCols);
      let col = localIdx % numCols;

      if (span === 2 || span === 3) { 
        if (col === numCols - 1 && numCols > 1) { col--; }
      }
      if (span === 3) { 
        if (row === numRows - 1 && numRows > 1) { row--; }
      }
      return pageStart + (row * numCols) + col + 1;
    }

    async function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.boxShadow = '';
      
      let sourceSlotNum = parseInt(e.dataTransfer.getData('text/plain'));
      if (isNaN(sourceSlotNum) && window.draggedSourceSlotNum !== undefined) {
        sourceSlotNum = window.draggedSourceSlotNum;
      }
      
      let targetSlotNum = parseInt(e.currentTarget.dataset.slot);
      if (!sourceSlotNum || isNaN(targetSlotNum)) return;

      const b = currentBinderData.binder;
      const numCols = parseInt(b.cols) || 3;
      const numRows = parseInt(b.rows) || 3;

      const sourceCard = currentBinderData.slots[sourceSlotNum];
      if (!sourceCard) return;

      const spanValue = sourceCard.slot_span || 1;

      let finalTargetSlotNum = adjustSlotForSpan(targetSlotNum, spanValue, numCols, numRows);
      if (sourceSlotNum === finalTargetSlotNum) return;

      const targetCard = currentBinderData.slots[finalTargetSlotNum];

      let simulatedSlots = { ...currentBinderData.slots };
      delete simulatedSlots[sourceSlotNum];
      delete simulatedSlots[finalTargetSlotNum];

      if (sourceCard) simulatedSlots[finalTargetSlotNum] = { ...sourceCard, slot_number: finalTargetSlotNum };
      if (targetCard) simulatedSlots[sourceSlotNum] = { ...targetCard, slot_number: sourceSlotNum };

      if (!checkBinderValidity(simulatedSlots, numCols, numRows)) {
        return;
      }

      try {
        currentBinderData.slots = simulatedSlots;
        renderActiveGrid();

        await Promise.all([
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_number: sourceSlotNum,
              card_id: targetCard ? (targetCard.card_id || null) : null,
              custom_image_url: targetCard ? (targetCard.custom_image_url || null) : null,
              slot_span: targetCard ? (targetCard.slot_span || 1) : 1
            })
          }),
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_number: finalTargetSlotNum,
              card_id: sourceCard.card_id || null,
              custom_image_url: sourceCard.custom_image_url || null,
              slot_span: spanValue
            })
          })
        ]);
      } catch (err) {
        alert("Unable to complete the move: " + err.message);
        selectBinder(currentBinderId, true);
      }
    }

    const SEARCH_HISTORY_KEY = 'pokyudex_binder_search_history';
    const SEARCH_HISTORY_MAX = 5;

    function getSearchHistory() {
      try {
        const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    }

    // MODIFICA CORRETTIVA: Filtro progressivo asincrono per rimuovere stringhe parziali o Typos consecutivi
    function addToSearchHistory(query) {
      const q = query.trim();
      if (q.length < 2) return;
      
      let history = getSearchHistory();
      const newQuery = q.toLowerCase();
      
      // Se nella cronologia esiste già una ricerca più completa (es. "mimikyu") evita di aggiungere frammenti corti (es. "mimi")
      if (history.some(h => h.toLowerCase().startsWith(newQuery))) {
        return;
      }
      
      // Elimina i vecchi frammenti parziali che sono stati superati dalla nuova ricerca estesa
      history = history.filter(h => {
        const item = h.toLowerCase();
        return item !== newQuery && !newQuery.startsWith(item);
      });
      
      history.unshift(q);
      history = history.slice(0, SEARCH_HISTORY_MAX);
      try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history)); } catch (e) { }
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const row = document.getElementById('search-history-row');
      const history = getSearchHistory();
      if (!history.length) { row.innerHTML = ''; return; }

      row.innerHTML = `<span style="font-family:'JetBrains Mono'; font-size:11px; color:var(--text-muted); align-self:center; margin-right:4px;">Recent:</span>`;
      history.forEach(term => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = term;
        chip.onclick = () => {
          document.getElementById('modal-card-search').value = term;
          execOverlaySearch();

        row.appendChild(chip);
      });
    }

          return;
        }
        url += `name=${encodeURIComponent(q.length >= 2 ? q : '')}`;
      }

      if (type) url += `&type=${encodeURIComponent(type)}`;

          container.innerHTML = '<div class="state-msg">No cards found. Try a different name or wait for sync.</div>';
          return;
        }

        // Spostato qui: Aggiunge alla cronologia solo se la ricerca produce risultati reali

        const grid = document.createElement('div');
        grid.className = 'cards-grid';
        
        const safePrice = (p, curr) => {
            try { return formatPrice(p, curr); }

        cards.forEach(c => {
          const tile = document.createElement('div');

              <div style="font-family:'JetBrains Mono'; font-size:10px; color:var(--gold); margin-top:4px;">${priceLabel}</div>
            </div>
          `;
          grid.appendChild(tile);
        });
        container.appendChild(grid);
      } catch (err) {
        container.innerHTML = `<div class="state-msg error">Connection error: ${err.message}</div>`;
      }

    function closeSearchOverlay() { document.getElementById('search-overlay').style.display = 'none'; }

    let cropperState = {
      active: false,
      imgWidth: 0, imgHeight: 0,
      viewWidth: 0, viewHeight: 0,
      zoom: 1, left: 0, top: 0,
      isDragging: false, startX: 0, startY: 0
    };

    function resetCropperState() {
      cropperState = { active: false, imgWidth: 0, imgHeight: 0, viewWidth: 0, viewHeight: 0, zoom: 1, left: 0, top: 0, isDragging: false, startX: 0, startY: 0 };
      document.getElementById('crop-zoom-slider').value = 1;
    }

    function updateCropTransform() {
      const img = document.getElementById('crop-preview-img');
      if (!img) return;
      img.style.transform = `translate(${cropperState.left}px, ${cropperState.top}px) scale(${cropperState.zoom})`;
    }

    function clampCropperPositions() {
      const scaledW = cropperState.imgWidth * cropperState.zoom;
      const scaledH = cropperState.imgHeight * cropperState.zoom;
      
      const minLeft = cropperState.viewWidth - scaledW;
      const minTop = cropperState.viewHeight - scaledH;
      
      cropperState.left = Math.min(0, Math.max(minLeft, cropperState.left));
      cropperState.top = Math.min(0, Math.max(minTop, cropperState.top));
    }

    function initCropperFramework(imgSrc, spanValue) {
      resetCropperState();
      const viewport = document.getElementById('crop-viewport');
      const img = document.getElementById('crop-preview-img');
      
      if (spanValue === 1) {
        cropperState.viewWidth = 172;
        cropperState.viewHeight = 240;
      } else if (spanValue === 2) {
        cropperState.viewWidth = 360;
        cropperState.viewHeight = 240;
      } else if (spanValue === 3) {
        cropperState.viewWidth = 360;
        cropperState.viewHeight = 496; 
      }

      viewport.style.width = `${cropperState.viewWidth}px`;
      viewport.style.height = `${cropperState.viewHeight}px`;

      img.onload = function() {
        cropperState.imgWidth = img.naturalWidth;
        cropperState.imgHeight = img.naturalHeight;

        const scaleX = cropperState.viewWidth / cropperState.imgWidth;
        const scaleY = cropperState.viewHeight / cropperState.imgHeight;
        const baseScale = Math.max(scaleX, scaleY);

        cropperState.zoom = baseScale;
        document.getElementById('crop-zoom-slider').min = baseScale;
        document.getElementById('crop-zoom-slider').max = baseScale * 4;
        document.getElementById('crop-zoom-slider').value = baseScale;

        cropperState.left = (cropperState.viewWidth - (cropperState.imgWidth * baseScale)) / 2;
        cropperState.top = (cropperState.viewHeight - (cropperState.imgHeight * baseScale)) / 2;
        
        cropperState.active = true;
        updateCropTransform();
        document.getElementById('cropper-ui-container').style.display = 'flex';
        document.getElementById('upload-confirm-btn').style.display = 'block';
      };
      img.src = imgSrc;
    }

    const viewportEl = document.getElementById('crop-viewport');
    viewportEl.addEventListener('pointerdown', (e) => {
      if (!cropperState.active) return;
      cropperState.isDragging = true;
      cropperState.startX = e.clientX - cropperState.left;
      cropperState.startY = e.clientY - cropperState.top;
      viewportEl.setPointerCapture(e.pointerId);
    });

    viewportEl.addEventListener('pointermove', (e) => {
      if (!cropperState.isDragging) return;
      cropperState.left = e.clientX - cropperState.startX;
      cropperState.top = e.clientY - cropperState.startY;
      clampCropperPositions();
      updateCropTransform();
    });

    viewportEl.addEventListener('pointerup', (e) => {
      cropperState.isDragging = false;
      try { viewportEl.releasePointerCapture(e.pointerId); } catch(err) {}
    });

    document.getElementById('crop-zoom-slider').addEventListener('input', (e) => {
      if (!cropperState.active) return;
      const oldZoom = cropperState.zoom;
      const newZoom = parseFloat(e.target.value);

      const centerX = cropperState.viewWidth / 2;
      const centerY = cropperState.viewHeight / 2;

      cropperState.left = centerX - ((centerX - cropperState.left) * newZoom / oldZoom);
      cropperState.top = centerY - ((centerY - cropperState.top) * newZoom / oldZoom);
      
      cropperState.zoom = newZoom;
      clampCropperPositions();
      updateCropTransform();
    });

    document.getElementById('modal-custom-file').addEventListener('change', (e) => {
      if (!e.target.files || !e.target.files[0]) return;
      const spanValue = parseInt(document.getElementById('modal-custom-span').value);
      const reader = new FileReader();
      reader.onload = function(evt) {
        initCropperFramework(evt.target.result, spanValue);
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('modal-custom-file').addEventListener('change', (e) => {
      const fileInput = document.getElementById('modal-custom-file');
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          initCropperFramework(evt.target.result, parseInt(document.getElementById('modal-custom-span').value));
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    });

    function getCoveredSlots(startSlot, span, numCols) {
      let covered = [];
      if (span === 2) {
        covered.push(startSlot + 1);
      } else if (span === 3) {
        covered.push(startSlot + 1);
        covered.push(startSlot + numCols);
        covered.push(startSlot + numCols + 1);
      }
      return covered;
    }

    async function uploadCustomImageSlot() {
      if (!cropperState.active) return;
      
      const b = currentBinderData.binder;
      const numCols = parseInt(b.cols) || 3;
      const numRows = parseInt(b.rows) || 3;
      const spanSelect = document.getElementById('modal-custom-span');
      const spanValue = parseInt(spanSelect.value);

      let finalSlotNumber = adjustSlotForSpan(targetSlotNumber, spanValue, numCols, numRows);

      let simulatedSlots = { ...currentBinderData.slots };
      simulatedSlots[finalSlotNumber] = { slot_span: spanValue };

      if (!checkBinderValidity(simulatedSlots, numCols, numRows)) {
        return;
      }

      const confirmBtn = document.getElementById('upload-confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Processing & Uploading...";

      const canvas = document.createElement('canvas');
      canvas.width = cropperState.viewWidth * 2; 
      canvas.height = cropperState.viewHeight * 2;
      const ctx = canvas.getContext('2d');

      const img = document.getElementById('crop-preview-img');

      ctx.drawImage(
        img,
        cropperState.left * 2,
        cropperState.top * 2,
        cropperState.imgWidth * cropperState.zoom * 2,
        cropperState.imgHeight * cropperState.zoom * 2
      );

      canvas.toBlob(async (blob) => {
        if (!blob) {
          alert("Error generating the cropped image.");
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Crop & Upload Item";
          return;
        }

        const formData = new FormData();
        formData.append('file', blob, 'cropped_item.png');

        try {
          const uploadData = await api('/api/upload', {
            method: 'POST',
            body: formData
          });

          await api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_number: finalSlotNumber,
              card_id: null,
              custom_image_url: uploadData.url,
              slot_span: spanValue
            })
          });

          closeSearchOverlay();
          selectBinder(currentBinderId, true);
        } catch (err) {
          alert(err.message);
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Crop & Upload Item";
        }
      }, 'image/png');
    }

    // MODIFICA CORRETTA: Incrementato il timer di attesa (Debounce) della tastiera a 450ms per prevenire termini parziali
    let searchDebounceTimer;
    const searchBarEl = document.getElementById('modal-card-search');

    searchBarEl.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => { execOverlaySearch(); }, 450);
    });

    searchBarEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(searchDebounceTimer);
        execOverlaySearch();
      }
    });

    function createBlankPageHTML(slotsCount, b, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      grid.style.background = 'transparent';
      grid.style.border = 'none';
      grid.style.boxShadow = 'none';
      const slotWidth = isBookMode ? '170px' : '180px';
      grid.style.margin = '0';
      grid.style.gridTemplateColumns = `repeat(${b.cols}, ${slotWidth})`;
      for (let i = 0; i < slotsCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'binder-slot binder-slot-blank';
        tile.style.width = slotWidth;
        grid.appendChild(tile);
      }
      return grid;
    }

    function createGridHTML(startSlot, slotsCount, b, slots, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      grid.style.background = b.panel_color || '#16141d';
      
      const baseWidth = isBookMode ? 170 : 180;
      const baseHeight = Math.floor(baseWidth * 88 / 63); 
      const numCols = parseInt(b.cols) || 3; 

      grid.style.margin = isBookMode ? '0' : '24px auto';
      grid.style.gridTemplateColumns = `repeat(${numCols}, ${baseWidth}px)`;

      let skippedSlots = new Set();

      for (let i = 0; i < slotsCount; i++) {
        const slotNum = startSlot + i;
        if (b && b.type === 'pokedex' && slotNum > 1025) break;

        if (skippedSlots.has(slotNum)) {
          continue;
        }

        const cardData = slots[slotNum];
        const span = (cardData && cardData.slot_span) ? cardData.slot_span : 1;
        
        if (span === 2) {
          skippedSlots.add(slotNum + 1);
        } else if (span === 3) {
          skippedSlots.add(slotNum + 1);
          skippedSlots.add(slotNum + numCols);
          skippedSlots.add(slotNum + numCols + 1);
        }

        const tile = document.createElement('div');
        tile.className = 'binder-slot';
        tile.dataset.slot = slotNum;
        
        if (span === 2) {
          tile.style.gridColumn = "span 2";
          tile.style.width = (baseWidth * 2 + 16) + "px"; 
          tile.style.height = baseHeight + "px";
          tile.style.aspectRatio = "auto";
        } else if (span === 3) {
          tile.style.gridColumn = "span 2";
          tile.style.gridRow = "span 2";
          tile.style.width = (baseWidth * 2 + 16) + "px"; 
          tile.style.height = (baseHeight * 2 + 16) + "px"; 
          tile.style.aspectRatio = "auto";
        } else {
          tile.style.width = baseWidth + "px";
          tile.style.height = baseHeight + "px";
        }
        
        tile.addEventListener('dragover', handleDragOver);
        tile.addEventListener('drop', handleDrop);
        
        tile.innerHTML = `<div class="slot-number">#${slotNum}</div>`;
        
        if (cardData) {
          tile.setAttribute('draggable', 'true');
          tile.addEventListener('dragstart', handleDragStart);
          
          let startX = 0;
          let startY = 0;
          
          tile.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
          });
          
          tile.addEventListener('pointerup', (e) => {
            if (e.target.closest('.slot-remove-btn')) return; 
            
            const diffX = Math.abs(e.clientX - startX);
            const diffY = Math.abs(e.clientY - startY);
            
            if (diffX < 5 && diffY < 5) {
              openModal(cardData);
            }
          });
          
          const imgUrl = cardData.custom_image_url || cardData.image_small;
          const priceLabel = cardData.custom_image_url ? null : formatPrice(cardData.price_market, cardData.currency);
          
          tile.innerHTML += `
            <button class="slot-remove-btn" onclick="event.stopPropagation(); clearSlot(${slotNum})">❌</button>
            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(cardData.name || 'Custom Image')}" draggable="false" style="pointer-events: none; object-fit: cover; width:100%; height:100%;">
            ${priceLabel ? `<div class="price-tag" style="bottom:6px; right:6px; font-size:10px; padding:2px 5px; z-index:4; pointer-events: none;">${priceLabel}</div>` : ''}
          `;
        } else {
          tile.removeAttribute('draggable');
          tile.innerHTML += `<div style="color:var(--text-muted); font-size:24px; font-weight:bold;">+</div>`;
          tile.onclick = () => { openSearchOverlay(slotNum); };
        }
        grid.appendChild(tile);
      }
      return grid;
    }

    function renderActiveGrid() {
      const wrapper = document.getElementById('binder-view-wrapper');
      const b = currentBinderData.binder;
      const slots = currentBinderData.slots;
      
      const slotsPerPage = b.rows * b.cols;
      wrapper.innerHTML = '';

      const accentHex = b.inner_color || b.color;
      wrapper.style.setProperty('--binder-accent', accentHex);
      wrapper.style.setProperty('--binder-accent-bg', hexToRgba(accentHex, 0.08));
      wrapper.style.setProperty('--binder-accent-glow', hexToRgba(accentHex, 0.28));

      const albumBackground = `linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.55) 100%), ${b.inner_color || b.color}`;
      const albumBoxShadow = `0 35px 80px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04)`;
      const albumBorder = `6px solid rgba(255, 255, 255, 0.08)`;

      if (viewMode === 'single') {
        const startSlot = ((currentPage - 1) * slotsPerPage) + 1;
        document.getElementById('page-indicator').textContent = `Page ${currentPage} (Slots ${startSlot}-${b.type==='pokedex'?Math.min(startSlot+slotsPerPage-1, 1025):startSlot+slotsPerPage-1})`;
        
        const singleSpread = document.createElement('div');
        singleSpread.className = 'binder-book-spread';
        singleSpread.style.background = albumBackground;
        singleSpread.style.boxShadow = albumBoxShadow;
        singleSpread.style.border = albumBorder;
        
        const grid = createGridHTML(startSlot, slotsPerPage, b, slots, false);
        singleSpread.appendChild(grid);
        wrapper.appendChild(singleSpread);
        
      } else {
        const isCoverSpread = currentPage === 1;
        const pageLeft = isCoverSpread ? null : currentPage;
        const pageRight = isCoverSpread ? 1 : currentPage + 1;

        const startSlotRight = ((pageRight - 1) * slotsPerPage) + 1;
        const rightExists = b.type !== 'pokedex' || startSlotRight <= 1025;

        document.getElementById('page-indicator').textContent = isCoverSpread
          ? `Page 1 (Cover)`
          : `Pages ${pageLeft}-${pageRight}`;

        const bookSpread = document.createElement('div');
        bookSpread.className = 'binder-book-spread';
        bookSpread.style.background = albumBackground;
        bookSpread.style.boxShadow = albumBoxShadow;
        bookSpread.style.border = albumBorder;

        if (isCoverSpread) {
          const blankContainer = document.createElement('div');
          blankContainer.className = 'binder-page-side';
          blankContainer.appendChild(createBlankPageHTML(slotsPerPage, b, true));
          bookSpread.appendChild(blankContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        } else {
          const startSlotLeft = ((pageLeft - 1) * slotsPerPage) + 1;
          const leftContainer = document.createElement('div');
          leftContainer.className = 'binder-page-side';
          const leftBadge = document.createElement('div');
          leftBadge.className = 'page-title-badge';
          leftBadge.textContent = `PAGE ${pageLeft} (Slots ${startSlotLeft}-${b.type==='pokedex'?Math.min(startSlotLeft+slotsPerPage-1, 1025):startSlotLeft+slotsPerPage-1})`;
          leftContainer.appendChild(leftBadge);
          leftContainer.appendChild(createGridHTML(startSlotLeft, slotsPerPage, b, slots, true));
          bookSpread.appendChild(leftContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        }

        if (rightExists) {
          const rightContainer = document.createElement('div');
          rightContainer.className = 'binder-page-side';
          const rightBadge = document.createElement('div');
          rightBadge.className = 'page-title-badge';
          rightBadge.textContent = isCoverSpread
            ? `COVER — PAGE 1 (Slots 1-${b.type==='pokedex'?Math.min(slotsPerPage, 1025):slotsPerPage})`
            : `PAGE ${pageRight} (Slots ${startSlotRight}-${b.type==='pokedex'?Math.min(startSlotRight+slotsPerPage-1, 1025):startSlotRight+slotsPerPage-1})`;
          rightContainer.appendChild(rightBadge);
          rightContainer.appendChild(createGridHTML(startSlotRight, slotsPerPage, b, slots, true));
          bookSpread.appendChild(rightContainer);
        }
        wrapper.appendChild(bookSpread);
      }
    }

    document.getElementById('nav-prev').onclick = () => {
      if (viewMode === 'single') {
        if (currentPage > 1) { currentPage--; renderActiveGrid(); }
      } else {
        if (currentPage === 2) { currentPage = 1; renderActiveGrid(); }
        else if (currentPage > 2) { currentPage -= 2; renderActiveGrid(); }
      }
    };

    document.getElementById('nav-next').onclick = () => {
      const b = currentBinderData.binder;
      const pokedexMaxPage = 114; 
      if (viewMode === 'single') {
        if (b.type === 'pokedex' && currentPage >= pokedexMaxPage) return;
        currentPage++;
        renderActiveGrid();
      } else {
        const nextLeft = currentPage === 1 ? 2 : currentPage + 2;
        if (b.type === 'pokedex' && nextLeft > pokedexMaxPage) return;
        currentPage = nextLeft;
        renderActiveGrid();
      }
    };

    async function clearSlot(num) {
      await api(`/api/binders/${currentBinderId}/slots`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_number: num, card_id: null })
      });
      selectBinder(currentBinderId, true); 
    }

    async function deleteCurrentBinder() {
      if(confirm("Are you sure you want to permanently delete this binder?")) {
        await api(`/api/binders/${currentBinderId}`, { method: 'DELETE' });
        currentBinderId = null;
        loadBinders();
      }
    }

    async function assignCardToSlot(cardId) {
      const b = currentBinderData.binder;
      let simulatedSlots = { ...currentBinderData.slots };
      simulatedSlots[targetSlotNumber] = { slot_span: 1, card_id: cardId };

      if (!checkBinderValidity(simulatedSlots, parseInt(b.cols), parseInt(b.rows))) {
        return;
      }

      await api(`/api/binders/${currentBinderId}/slots`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_number: targetSlotNumber, card_id: cardId, custom_image_url: null, slot_span: 1 })
      });
      closeSearchOverlay();
      selectBinder(currentBinderId, true); 
    }

    function openModal(cardData) {
      const modal = document.getElementById('card-modal');
      const img = document.getElementById('modal-img');
      const nameEl = document.getElementById('modal-card-name');
      const priceEl = document.getElementById('modal-card-price');

      img.src = cardData.custom_image_url || cardData.image_large || cardData.image_small || '';
      img.alt = cardData.name || 'Enlarged item';
      nameEl.textContent = cardData.name || 'Custom Divider / Artwork';

      let priceLabel = 'Custom Content';
      if (!cardData.custom_image_url) {
        try {
          priceLabel = formatPrice(cardData.price_market, cardData.currency) || priceLabel;
        } catch (e) { }
      }
      priceEl.textContent = priceLabel;

      modal.style.display = 'flex';
      requestAnimationFrame(() => modal.classList.add('active'));
      document.addEventListener('keydown', handleModalEscape);
    }

    if (typeof closeModal === 'undefined') {
      window.closeModal = function() {
        const modal = document.getElementById('card-modal');
        modal.classList.remove('active');
        setTimeout(() => { if (!modal.classList.contains('active')) modal.style.display = 'none'; }, 250);
      }
    }

    function handleModalEscape(e) {
      if (e.key === 'Escape') closeModal();
    }

    requireAuth().then(user => { if (user) loadBinders(); });
  </script>
</body>
</html>
