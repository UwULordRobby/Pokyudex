<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokyudex — Binders</title>
  <link rel="stylesheet" href="style.css" />
  <style>:root { --dot-color: #4f8bf9; }</style>
  <style>
    .binder-shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin: 24px 0 10px;
    }
    .binder-cover-card {
      position: relative;
      border-radius: 14px;
      padding: 20px 16px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      border: 6px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .binder-cover-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.55);
    }
    .binder-cover-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.5) 100%);
    }
    .binder-cover-spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: rgba(0,0,0,0.35);
    }
    .binder-cover-name {
      position: relative;
      z-index: 1;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      line-height: 1.2;
    }
    .binder-cover-meta {
      position: relative;
      z-index: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .binder-cover-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }
    .binder-cover-actions button {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .binder-cover-actions button:hover { background: rgba(0,0,0,0.75); }
    .binder-cover-card.empty-state {
      align-items: center;
      justify-content: center;
      cursor: default;
      border-style: dashed;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .binder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
    .creator-panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); margin-bottom: 30px; }
    .form-group { display: inline-flex; flex-direction: column; margin-right: 14px; margin-bottom: 10px; }
    .form-group label { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; }
    .binder-tab-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,9,14,0.95); z-index: 1100; padding: 40px; overflow-y: auto; }
    
    /* ADAPTIVE STRUCTURE FOR THE BINDER COVER */
    .binder-book-spread {
      display: flex;
      flex-wrap: nowrap; /* Prevents the right page from wrapping below */
      align-items: stretch;
      padding: 24px;
      border-radius: 20px;
      margin: 24px auto;
      width: max-content; /* Forces the cover to expand based on the chosen columns */
      max-width: 100%; /* 100% is now the REAL screen width (thanks to the full-width wrapper), not the narrow .container width */
      overflow-x: auto; /* Safety net: only kicks in for extreme configurations that don't fit even at full screen */
      position: relative;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    /* The binder "escapes" the central .container to use the full screen width,
       without touching the cards: the pages grow, not the card sizes. */
    #binder-view-wrapper {
      width: 100vw;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      box-sizing: border-box;
      padding: 0 24px;
    }
    
    .binder-page-side { display: flex; flex-direction: column; flex-shrink: 0; }
    .binder-spine {
      width: 24px;
      margin: 0 12px;
      flex-shrink: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.55), rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.03) 70%, rgba(0,0,0,0.55));
      border-left: 1px solid rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.02);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      border-radius: 4px;
    }
    .page-title-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      background: rgba(6, 5, 9, 0.88);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .slot-remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(20, 18, 26, 0.85);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    .slot-remove-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
      transform: scale(1.05);
    }

    .binder-slot-blank {
      cursor: default;
      background: transparent;
      border: none;
    }
    .binder-slot-blank:hover {
      transform: none;
      box-shadow: none;
      border-color: transparent;
      background: transparent;
    }

    .binder-slot[draggable="true"]:active { cursor: grabbing; }
    .binder-slot[draggable="true"]:hover img { filter: brightness(1.08); }
    .binder-slot img { transition: filter 0.15s ease; }

    /* --- "Card zoom" modal --- */
    #card-modal {
      z-index: 2000;
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    #card-modal.active { display: flex; }
    #card-modal .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 7, 12, 0.92);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.25s ease;
      cursor: zoom-out;
    }
    #card-modal.active .modal-backdrop { opacity: 1; }

    .modal-card-frame {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.85);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.22s ease;
      max-width: 90vw;
    }
    #card-modal.active .modal-card-frame { transform: scale(1); opacity: 1; }

    .modal-card-frame .modal-content {
      max-height: 76vh;
      max-width: 90vw;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      display: block;
    }

    .modal-card-info { text-align: center; margin-top: 16px; }
    .modal-card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .modal-card-price {
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold);
      font-size: 14px;
      margin-top: 4px;
    }

    .modal-close {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--panel, #1c1a25);
      border: 1px solid var(--border, #333);
      color: var(--text, #fff);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .modal-close:hover { background: var(--danger, #e5484d); color: #fff; border-color: var(--danger, #e5484d); }
  </style>
</head>

  <script src="app.js"></script>
  <script>
    // Blue palette matching the binders page's fixed brand dot — restored
    // whenever no binder is open.
    const DEFAULT_BINDER_PALETTE = [
      { h: 217, s: 78, l: 62 },
      { h: 195, s: 70, l: 60 },
      { h: 240, s: 62, l: 50 },
    ];
    const DEFAULT_BINDER_DOT_COLOR = '#4f8bf9';
    renderBloomLayer(DEFAULT_BINDER_PALETTE);

    // Converts a hex color (e.g. "#4f8bf9") to {h, s, l}, so a binder's
    // own colors can drive the bloom background exactly like set.html
    // does with card artwork.
    // Converts a hex color to an "rgba(r, g, b, alpha)" string, used to
    // build the theme-aware hover highlight for empty slots.
    function hexToRgba(hex, alpha) {
      const c = (hex || '#f0b93d').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) || 0;
      const g = parseInt(c.substring(2, 4), 16) || 0;
      const b = parseInt(c.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function hexToHsl(hex) {
      const c = (hex || '#4f8bf9').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) / 255;
      const g = parseInt(c.substring(2, 4), 16) / 255;
      const b = parseInt(c.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
          case r: h = ((g - b) / d) % 6; break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    // Re-themes the page bloom + brand dot to match the open binder's own
    // cover/inner colors instead of the fixed default blue palette.
    function applyBinderTheme(b) {
      const coverHsl = hexToHsl(b.color);
      const innerHsl = hexToHsl(b.inner_color || b.color);
      const panelHsl = hexToHsl(b.panel_color || '#16141d');
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const dotColor = `hsl(${coverHsl.h}, ${clamp(coverHsl.s + 10, 0, 100)}%, ${clamp(coverHsl.l + 8, 25, 78)}%)`;
      document.documentElement.style.setProperty('--dot-color', dotColor);
      renderBloomLayer([coverHsl, innerHsl, panelHsl]);
    }

    function resetBinderTheme() {
      document.documentElement.style.setProperty('--dot-color', DEFAULT_BINDER_DOT_COLOR);
      renderBloomLayer(DEFAULT_BINDER_PALETTE);
    }

    let binders = [];
    let currentBinderId = null;
    let currentBinderData = null;
    let currentPage = 1; 
    let viewMode = 'single'; 
    let targetSlotNumber = null;

    const viewSingleBtn = document.getElementById('view-single-btn');
    const viewBookBtn = document.getElementById('view-book-btn');

    viewSingleBtn.addEventListener('click', () => {
      viewSingleBtn.className = 'chip active';
      viewBookBtn.className = 'chip';
      viewMode = 'single';
      renderActiveGrid();
    });

    viewBookBtn.addEventListener('click', () => {
      viewBookBtn.className = 'chip active';
      viewSingleBtn.className = 'chip';
      viewMode = 'book';
      // Page 1 is always shown alone (like a cover). Every other spread
      // pairs an even page with the following odd one (2-3, 4-5, ...),
      // so any odd page beyond 1 needs to snap back to its even partner.
      if (currentPage > 1 && currentPage % 2 !== 0) { currentPage--; }
      renderActiveGrid();
    });

    let editingBinderId = null;

    async function loadBinders() {
      binders = await api('/api/binders');
      renderBinderShelf();
    }

    function renderBinderShelf() {
      const shelf = document.getElementById('binder-shelf');
      shelf.innerHTML = '';
      if (!binders.length) {
        const empty = document.createElement('div');
        empty.className = 'binder-cover-card empty-state';
        empty.textContent = 'No binders yet — create one above!';
        shelf.appendChild(empty);
        return;
      }
      binders.forEach(b => {
        const card = document.createElement('div');
        card.className = 'binder-cover-card';
        card.style.background = `linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.55) 100%), ${b.color}`;
        card.onclick = () => openBinder(b.id);
        card.innerHTML = `
          <div class="binder-cover-spine"></div>
          <div class="binder-cover-actions">
            <button title="Edit" onclick="event.stopPropagation(); openEditBinderModal(${b.id})">✎</button>
            <button title="Delete" onclick="event.stopPropagation(); deleteBinderById(${b.id})">🗑</button>
          </div>
          <div class="binder-cover-name">${escapeHtml(b.name)}</div>
          <div class="binder-cover-meta">${b.type === 'pokedex' ? 'National Pokédex' : `${b.rows}×${b.cols} grid`}</div>
        `;
        shelf.appendChild(card);
      });
    }

    async function createNewBinder() {
      const name = document.getElementById('b-name').value.trim() || "New Binder";
      const type = document.getElementById('b-type').value;
      const color = document.getElementById('b-color').value;
      const inner_color = document.getElementById('b-inner-color').value;
      const panel_color = document.getElementById('b-panel-color').value;
      const rows = type === 'pokedex' ? 3 : document.getElementById('b-rows').value;
      const cols = type === 'pokedex' ? 3 : document.getElementById('b-cols').value;

      await api('/api/binders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, color, inner_color, panel_color, rows, cols, type })
      });
      document.getElementById('b-name').value = '';
      loadBinders();
    }

    // Opens a binder into the full album/reader view (was "selectBinder").
    async function openBinder(id, preservePage = false) {
      currentBinderId = id;
      if (!preservePage) { currentPage = 1; }

      currentBinderData = await api(`/api/binders/${id}`);
      document.getElementById('binder-shelf').style.display = 'none';
      document.querySelector('.creator-panel').style.display = 'none';
      document.getElementById('active-binder-view').style.display = 'block';
      document.getElementById('active-title').textContent = currentBinderData.binder.name;
      document.getElementById('active-title').style.borderBottom = `3px solid ${currentBinderData.binder.color}`;
      applyBinderTheme(currentBinderData.binder);

      if(currentBinderData.binder.type === 'pokedex') {
        document.getElementById('active-meta').textContent = "National Master Collection — 1025 Total Slots (3x3 Pages)";
      } else {
        document.getElementById('active-meta').textContent = `Page Grid Format: ${currentBinderData.binder.rows}x${currentBinderData.binder.cols}`;
      }
      renderActiveGrid();
    }

    // Kept as an alias: several helpers below (drag/drop recovery, slot
    // assignment) still call selectBinder(id, true) to refresh + stay open.
    function selectBinder(id, preservePage = false) { return openBinder(id, preservePage); }

    function closeActiveBinder() {
      currentBinderId = null;
      currentBinderData = null;
      document.getElementById('active-binder-view').style.display = 'none';
      document.getElementById('binder-shelf').style.display = 'grid';
      document.querySelector('.creator-panel').style.display = 'block';
      resetBinderTheme();
      loadBinders();
    }

    function openEditBinderModal(id) {
      const b = binders.find(x => x.id === id) || (currentBinderData && currentBinderData.binder.id === id ? currentBinderData.binder : null);
      if (!b) return;
      editingBinderId = id;
      document.getElementById('edit-b-name').value = b.name;
      document.getElementById('edit-b-color').value = b.color;
      document.getElementById('edit-b-inner-color').value = b.inner_color || b.color;
      document.getElementById('edit-b-panel-color').value = b.panel_color || '#16141d';
      document.getElementById('edit-binder-modal').style.display = 'flex';
    }

    function closeEditBinderModal() {
      document.getElementById('edit-binder-modal').style.display = 'none';
    }

    async function saveEditBinder() {
      const name = document.getElementById('edit-b-name').value.trim();
      const color = document.getElementById('edit-b-color').value;
      const inner_color = document.getElementById('edit-b-inner-color').value;
      const panel_color = document.getElementById('edit-b-panel-color').value;
      if (!name) { alert('Name cannot be empty.'); return; }
      try {
        const updated = await api(`/api/binders/${editingBinderId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color, inner_color, panel_color })
        });
        closeEditBinderModal();
        if (currentBinderId === editingBinderId && currentBinderData) {
          currentBinderData.binder = updated;
          document.getElementById('active-title').textContent = updated.name;
          document.getElementById('active-title').style.borderBottom = `3px solid ${updated.color}`;
          applyBinderTheme(updated);
          renderActiveGrid();
        }
        loadBinders();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteBinderById(id) {
      if (!confirm("Are you sure you want to permanently delete this binder?")) return;
      await api(`/api/binders/${id}`, { method: 'DELETE' });
      if (currentBinderId === id) { closeActiveBinder(); } else { loadBinders(); }
    }

    function handleDragStart(e) {
      if (e.target.closest('.overlay-btn') || e.target.closest('.slot-remove-btn')) {
        e.preventDefault();
        return false;
      }
      e.dataTransfer.effectAllowed = 'move';
      const slotNum = e.currentTarget.dataset.slot;
      e.dataTransfer.setData('text/plain', slotNum);
      window.draggedSourceSlotNum = parseInt(slotNum); 
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.style.borderColor = 'var(--gold)';
      e.currentTarget.style.boxShadow = '0 0 15px rgba(240, 185, 61, 0.4)';
    }

    function handleDragLeave(e) {
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.boxShadow = '';
    }

    async function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.boxShadow = '';
      
      let sourceSlotNum = parseInt(e.dataTransfer.getData('text/plain'));
      if (isNaN(sourceSlotNum) && window.draggedSourceSlotNum !== undefined) {
        sourceSlotNum = window.draggedSourceSlotNum;
      }
      
      const targetSlotNum = parseInt(e.currentTarget.dataset.slot);
      if (!sourceSlotNum || sourceSlotNum === targetSlotNum) return;

      const sourceCard = currentBinderData.slots[sourceSlotNum];
      const targetCard = currentBinderData.slots[targetSlotNum];

      const sourceCardId = sourceCard ? sourceCard.card_id : null;
      const targetCardId = targetCard ? targetCard.card_id : null;

      if (!sourceCardId && !targetCardId) return;

      try {
        if (targetCardId) {
          currentBinderData.slots[sourceSlotNum] = { ...targetCard, slot_number: sourceSlotNum };
        } else {
          delete currentBinderData.slots[sourceSlotNum];
        }

        if (sourceCardId) {
          currentBinderData.slots[targetSlotNum] = { ...sourceCard, slot_number: targetSlotNum };
        } else {
          delete currentBinderData.slots[targetSlotNum];
        }

        renderActiveGrid();

        await Promise.all([
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slot_number: sourceSlotNum, card_id: targetCardId })
          }),
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slot_number: targetSlotNum, card_id: sourceCardId })
          })
        ]);
      } catch (err) {
        alert("Unable to complete the move: " + err.message);
        selectBinder(currentBinderId, true);
      }
    }

    // ---------- Recent card-search history (binder slot picker) ----------
    // Keeps the last 5 distinct name searches so they're one click away
    // next time you're filling a binder. Stored client-side (per browser)
    // since it's just a convenience shortcut, not account data.
    const SEARCH_HISTORY_KEY = 'pokyudex_binder_search_history';
    const SEARCH_HISTORY_MAX = 5;

    function getSearchHistory() {
      try {
        const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    }

    function addToSearchHistory(query) {
      const q = query.trim();
      if (q.length < 2) return;
      let history = getSearchHistory().filter(h => h.toLowerCase() !== q.toLowerCase());
      history.unshift(q);
      history = history.slice(0, SEARCH_HISTORY_MAX);
      try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* storage unavailable, skip */ }
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const row = document.getElementById('search-history-row');
      const history = getSearchHistory();
      if (!history.length) { row.innerHTML = ''; return; }

      row.innerHTML = `<span style="font-family:'JetBrains Mono'; font-size:11px; color:var(--text-muted); align-self:center; margin-right:4px;">Recent:</span>`;
      history.forEach(term => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = term;
        chip.onclick = () => {
          document.getElementById('modal-card-search').value = term;
          execOverlaySearch();
        };
        row.appendChild(chip);
      });
    }

    async function execOverlaySearch() {
      const q = document.getElementById('modal-card-search').value.trim();
      const rarity = document.getElementById('modal-rarity-select').value;
      const type = document.getElementById('modal-type-select').value;
      const b = currentBinderData.binder;
      const container = document.getElementById('modal-results-container');
      
      container.innerHTML = '<div class="state-msg"><span class="spinner"></span>Searching the Pokédex...</div>';
      
      let url = `/api/cards/search?`;
      if (b && b.type === 'pokedex') {
        url += `pokedex_number=${targetSlotNumber}`;
        if (q) url += `&name=${encodeURIComponent(q)}`;
      } else {
        if (q.length < 2 && !rarity && !type) {
          container.innerHTML = '<div class="state-msg">Type at least 2 letters, or pick a rarity/type, to search...</div>';
          return;
        }
        url += `name=${encodeURIComponent(q.length >= 2 ? q : '')}`;
      }
      if (rarity) url += `&rarity=${encodeURIComponent(rarity)}`;
      if (type) url += `&type=${encodeURIComponent(type)}`;

      if (q.length >= 2) { addToSearchHistory(q); }
      
      try {
        const cards = await api(url);
        container.innerHTML = '';
        
        if (!cards || cards.length === 0) {
          container.innerHTML = '<div class="state-msg">No cards found. Try a different name or wait for sync.</div>';
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'cards-grid';
        
        const safePrice = (p, curr) => {
            try { return formatPrice(p, curr); } 
            catch(e) { return p ? `${p} ${curr||''}` : 'n/a'; }
        };

        cards.forEach(c => {
          const tile = document.createElement('div');
          tile.className = 'card-tile';
          tile.onclick = () => { assignCardToSlot(c.id); };
          
          const priceLabel = safePrice(c.price_market, c.currency);

          tile.innerHTML = `
            <img src="${escapeHtml(c.image_small)}" alt="${escapeHtml(c.name)}" loading="lazy">
            <div class="card-info">
              <div class="card-name">${escapeHtml(c.name)} (${escapeHtml(c.card_number)})</div>
              <div class="card-rarity">${escapeHtml(c.rarity || 'Rarity n/a')}</div>
              <div class="card-rarity" style="color:var(--teal); text-transform:none;">${escapeHtml(c.set_name || 'Unknown set')}</div>
              <div style="font-family:'JetBrains Mono'; font-size:10px; color:var(--gold); margin-top:4px;">${priceLabel}</div>
            </div>
          `;
          grid.appendChild(tile);
        });
        container.appendChild(grid);
      } catch (err) {
        container.innerHTML = `<div class="state-msg error">Connection error: ${err.message}</div>`;
      }
    }

    let modalFiltersLoaded = false;
    async function loadModalFilters() {
      if (modalFiltersLoaded) return;
      modalFiltersLoaded = true;
      try {
        const [rarities, types] = await Promise.all([api('/api/rarities'), api('/api/types')]);
        const raritySelect = document.getElementById('modal-rarity-select');
        rarities.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r; opt.textContent = r;
          raritySelect.appendChild(opt);
        });
        const typeSelect = document.getElementById('modal-type-select');
        types.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t; opt.textContent = t;
          typeSelect.appendChild(opt);
        });
      } catch (err) { console.error('Failed to load rarity/type filters:', err); }
    }
    document.getElementById('modal-rarity-select').addEventListener('change', execOverlaySearch);
    document.getElementById('modal-type-select').addEventListener('change', execOverlaySearch);

    function openSearchOverlay(slotNum) {
      targetSlotNumber = slotNum;
      document.getElementById('target-slot-title').textContent = slotNum;
      document.getElementById('search-overlay').style.display = 'block';
      document.getElementById('modal-card-search').value = '';
      document.getElementById('modal-rarity-select').value = '';
      document.getElementById('modal-type-select').value = '';
      document.getElementById('modal-results-container').innerHTML = '';
      document.getElementById('modal-card-search').focus();
      renderSearchHistory();
      loadModalFilters();
      
      const b = currentBinderData.binder;
      if (b && b.type === 'pokedex') {
        document.getElementById('modal-card-search').placeholder = `Showing only cards for Pokédex position #${slotNum}...`;
        execOverlaySearch(); 
      } else {
        document.getElementById('modal-card-search').placeholder = "Type the Pokémon name (e.g. Charizard)...";
      }
    }

    function closeSearchOverlay() { document.getElementById('search-overlay').style.display = 'none'; }

    let searchDebounceTimer;
    document.getElementById('modal-card-search').addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => { execOverlaySearch(); }, 300);
    });

    function createBlankPageHTML(slotsCount, b, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      // Fully transparent: shows the album's own background straight
      // through, guaranteeing a perfect (not just similar) color match
      // instead of trying to replicate its gradient separately.
      grid.style.background = 'transparent';
      grid.style.border = 'none';
      grid.style.boxShadow = 'none';
      const slotWidth = isBookMode ? '170px' : '180px';
      grid.style.margin = '0';
      grid.style.gridTemplateColumns = `repeat(${b.cols}, ${slotWidth})`;
      for (let i = 0; i < slotsCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'binder-slot binder-slot-blank';
        tile.style.width = slotWidth;
        grid.appendChild(tile);
      }
      return grid;
    }

    function createGridHTML(startSlot, slotsCount, b, slots, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      grid.style.background = b.panel_color || '#16141d';
      
      const slotWidth = isBookMode ? '170px' : '180px';
      grid.style.margin = isBookMode ? '0' : '24px auto';
      grid.style.gridTemplateColumns = `repeat(${b.cols}, ${slotWidth})`;

      for (let i = 0; i < slotsCount; i++) {
        const slotNum = startSlot + i;
        if (b && b.type === 'pokedex' && slotNum > 1025) break;

        const tile = document.createElement('div');
        tile.className = 'binder-slot';
        tile.style.width = slotWidth;
        tile.dataset.slot = slotNum;
        
        tile.addEventListener('dragover', handleDragOver);
        tile.addEventListener('dragleave', handleDragLeave);
        tile.addEventListener('drop', handleDrop);
        
        const cardData = slots[slotNum];
        tile.innerHTML = `<div class="slot-number">#${slotNum}</div>`;
        
        if (cardData) {
          tile.setAttribute('draggable', 'true');
          tile.addEventListener('dragstart', handleDragStart);
          
          let startX = 0;
          let startY = 0;
          
          tile.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
          });
          
          tile.addEventListener('pointerup', (e) => {
            if (e.target.closest('.slot-remove-btn')) return; 
            
            const diffX = Math.abs(e.clientX - startX);
            const diffY = Math.abs(e.clientY - startY);
            
            if (diffX < 5 && diffY < 5) {
              openModal(cardData);
            }
          });
          
          const priceLabel = formatPrice(cardData.price_market, cardData.currency);
          tile.innerHTML += `
            <button class="slot-remove-btn" onclick="event.stopPropagation(); clearSlot(${slotNum})">❌</button>
            <img src="${escapeHtml(cardData.image_small)}" alt="${escapeHtml(cardData.name)}" draggable="false" style="pointer-events: none;">
            <div class="price-tag" style="bottom:6px; right:6px; font-size:10px; padding:2px 5px; z-index:4; pointer-events: none;">${priceLabel || 'n/a'}</div>
          `;
        } else {
          tile.removeAttribute('draggable');
          tile.innerHTML += `<div style="color:var(--text-muted); font-size:24px; font-weight:bold;">+</div>`;
          tile.onclick = () => { openSearchOverlay(slotNum); };
        }
        grid.appendChild(tile);
      }
      return grid;
    }

    function renderActiveGrid() {
      const wrapper = document.getElementById('binder-view-wrapper');
      const b = currentBinderData.binder;
      const slots = currentBinderData.slots;
      
      const slotsPerPage = b.rows * b.cols;
      wrapper.innerHTML = '';

      // Empty-slot hover highlight follows this binder's own inner color
      // instead of the fixed gold accent (see .binder-slot:hover in
      // style.css, which reads these variables with a gold fallback).
      const accentHex = b.inner_color || b.color;
      wrapper.style.setProperty('--binder-accent', accentHex);
      wrapper.style.setProperty('--binder-accent-bg', hexToRgba(accentHex, 0.08));
      wrapper.style.setProperty('--binder-accent-glow', hexToRgba(accentHex, 0.28));

      // BACKGROUND GRADIENT COMBINATION FOR THE REACTIVE LEATHERETTE LOOK
      // inner_color is the "page matting" around the grid; panel_color
      // (used inside createGridHTML/createBlankPageHTML) is the grid
      // itself — the two are intentionally independent so they can
      // contrast with each other.
      const albumBackground = `linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.55) 100%), ${b.inner_color || b.color}`;
      const albumBoxShadow = `0 35px 80px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04)`;
      const albumBorder = `6px solid rgba(255, 255, 255, 0.08)`;

      if (viewMode === 'single') {
        const startSlot = ((currentPage - 1) * slotsPerPage) + 1;
        document.getElementById('page-indicator').textContent = `Page ${currentPage} (Slots ${startSlot}-${b.type==='pokedex'?Math.min(startSlot+slotsPerPage-1, 1025):startSlot+slotsPerPage-1})`;
        
        const singleSpread = document.createElement('div');
        singleSpread.className = 'binder-book-spread';
        singleSpread.style.background = albumBackground;
        singleSpread.style.boxShadow = albumBoxShadow;
        singleSpread.style.border = albumBorder;
        
        const grid = createGridHTML(startSlot, slotsPerPage, b, slots, false);
        singleSpread.appendChild(grid);
        wrapper.appendChild(singleSpread);
        
      } else {
        // Page 1 is always a solo "cover" page shown on the right.
        // Every subsequent spread pairs an even page with the odd page
        // right after it (2-3, 4-5, 6-7, ...).
        const isCoverSpread = currentPage === 1;
        const pageLeft = isCoverSpread ? null : currentPage;
        const pageRight = isCoverSpread ? 1 : currentPage + 1;

        const startSlotRight = ((pageRight - 1) * slotsPerPage) + 1;
        const rightExists = b.type !== 'pokedex' || startSlotRight <= 1025;

        document.getElementById('page-indicator').textContent = isCoverSpread
          ? `Page 1 (Cover)`
          : `Pages ${pageLeft}-${pageRight}`;

        const bookSpread = document.createElement('div');
        bookSpread.className = 'binder-book-spread';
        bookSpread.style.background = albumBackground;
        bookSpread.style.boxShadow = albumBoxShadow;
        bookSpread.style.border = albumBorder;

        if (isCoverSpread) {
          const blankContainer = document.createElement('div');
          blankContainer.className = 'binder-page-side';
          blankContainer.appendChild(createBlankPageHTML(slotsPerPage, b, true));
          bookSpread.appendChild(blankContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        } else {
          const startSlotLeft = ((pageLeft - 1) * slotsPerPage) + 1;
          const leftContainer = document.createElement('div');
          leftContainer.className = 'binder-page-side';
          const leftBadge = document.createElement('div');
          leftBadge.className = 'page-title-badge';
          leftBadge.textContent = `PAGE ${pageLeft} (Slots ${startSlotLeft}-${b.type==='pokedex'?Math.min(startSlotLeft+slotsPerPage-1, 1025):startSlotLeft+slotsPerPage-1})`;
          leftContainer.appendChild(leftBadge);
          leftContainer.appendChild(createGridHTML(startSlotLeft, slotsPerPage, b, slots, true));
          bookSpread.appendChild(leftContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        }

        if (rightExists) {
          const rightContainer = document.createElement('div');
          rightContainer.className = 'binder-page-side';
          const rightBadge = document.createElement('div');
          rightBadge.className = 'page-title-badge';
          rightBadge.textContent = isCoverSpread
            ? `COVER — PAGE 1 (Slots 1-${b.type==='pokedex'?Math.min(slotsPerPage, 1025):slotsPerPage})`
            : `PAGE ${pageRight} (Slots ${startSlotRight}-${b.type==='pokedex'?Math.min(startSlotRight+slotsPerPage-1, 1025):startSlotRight+slotsPerPage-1})`;
          rightContainer.appendChild(rightBadge);
          rightContainer.appendChild(createGridHTML(startSlotRight, slotsPerPage, b, slots, true));
          bookSpread.appendChild(rightContainer);
        }
        wrapper.appendChild(bookSpread);
      }
    }

    document.getElementById('nav-prev').onclick = () => {
      if (viewMode === 'single') {
        if (currentPage > 1) { currentPage--; renderActiveGrid(); }
      } else {
        if (currentPage === 2) { currentPage = 1; renderActiveGrid(); }
        else if (currentPage > 2) { currentPage -= 2; renderActiveGrid(); }
      }
    };

    document.getElementById('nav-next').onclick = () => {
      const b = currentBinderData.binder;
      const pokedexMaxPage = 114; // Math.ceil(1025 / 9)
      if (viewMode === 'single') {
        if (b.type === 'pokedex' && currentPage >= pokedexMaxPage) return;
        currentPage++;
        renderActiveGrid();
      } else {
        const nextLeft = currentPage === 1 ? 2 : currentPage + 2;
        if (b.type === 'pokedex' && nextLeft > pokedexMaxPage) return;
        currentPage = nextLeft;
        renderActiveGrid();
      }
    };

    async function clearSlot(num) {
      await api(`/api/binders/${currentBinderId}/slots`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_number: num, card_id: null })
      });
      selectBinder(currentBinderId, true); 
    }

    async function deleteCurrentBinder() {
      if(confirm("Are you sure you want to permanently delete this binder?")) {
        await api(`/api/binders/${currentBinderId}`, { method: 'DELETE' });
        currentBinderId = null;
        loadBinders();
      }
    }

    async function assignCardToSlot(cardId) {
      await api(`/api/binders/${currentBinderId}/slots`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_number: targetSlotNumber, card_id: cardId })
      });
      closeSearchOverlay();
      selectBinder(currentBinderId, true); 
    }

    function openModal(cardData) {
      const modal = document.getElementById('card-modal');
      const img = document.getElementById('modal-img');
      const nameEl = document.getElementById('modal-card-name');
      const priceEl = document.getElementById('modal-card-price');

      img.src = cardData.image_large || cardData.image_small || '';
      img.alt = cardData.name || 'Enlarged card';
      nameEl.textContent = cardData.name || '';

      let priceLabel = 'Price n/a';
      try {
        priceLabel = formatPrice(cardData.price_market, cardData.currency) || priceLabel;
      } catch (e) { }
      priceEl.textContent = priceLabel;

      modal.style.display = 'flex';
      requestAnimationFrame(() => modal.classList.add('active'));
      document.addEventListener('keydown', handleModalEscape);
    }

    function closeModal() {
      const modal = document.getElementById('card-modal');
      modal.classList.remove('active');
      document.removeEventListener('keydown', handleModalEscape);
      setTimeout(() => {
        if (!modal.classList.contains('active')) modal.style.display = 'none';
      }, 250);
    }

    function handleModalEscape(e) {
      if (e.key === 'Escape') closeModal();
    }

    requireAuth().then(user => { if (user) loadBinders(); });
  </script>
</body>
