<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokyudex — Binders</title>
  <link rel="stylesheet" href="style.css" />
  <style>:root { --dot-color: #4f8bf9; }</style>
  <style>
    .binder-shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin: 24px 0 10px;
    }
    .binder-cover-card {
      position: relative;
      border-radius: 14px;
      padding: 20px 16px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      border: 6px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .binder-cover-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.55);
    }
    .binder-cover-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.5) 100%);
    }
    .binder-cover-spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: rgba(0,0,0,0.35);
    }
    .binder-cover-name {
      position: relative;
      z-index: 1;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      line-height: 1.2;
    }
    .binder-cover-meta {
      position: relative;
      z-index: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .binder-cover-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }
    .binder-cover-actions button {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .binder-cover-actions button:hover { background: rgba(0,0,0,0.75); }
    .binder-cover-card.empty-state {
      align-items: center;
      justify-content: center;
      cursor: default;
      border-style: dashed;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .form-group { display: inline-flex; flex-direction: column; margin-right: 14px; margin-bottom: 10px; }
    .form-group label { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; }
    
    .search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,9,14,0.95); z-index: 1100; padding: 40px; overflow-y: auto; }
    .search-overlay.upload-mode { background: rgba(10,9,14,0.4) !important; backdrop-filter: none !important; }
    .search-overlay.upload-mode .hide-on-upload { display: none !important; }
    
    .binder-toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 24px;
      margin: 20px auto;
      max-width: 1100px;
      gap: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .binder-toolbar-left { display: flex; justify-content: flex-start; }
    .binder-toolbar-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .binder-toolbar-right { display: flex; justify-content: flex-end; }

    .binder-book-spread {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      padding: 24px;
      border-radius: 20px;
      margin: 24px auto;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      position: relative;
    }

    #binder-view-wrapper {
      width: 100vw;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      box-sizing: border-box;
      padding: 0 24px;
    }
    
    .binder-page-side { display: flex; flex-direction: column; flex-shrink: 0; }
    
    .binder-spine {
      width: 24px;
      margin: 0 12px;
      flex-shrink: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.55), rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.03) 70%, rgba(0,0,0,0.55));
      border-left: 1px solid rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.02);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      border-radius: 4px;
    }
    
    .page-title-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      background: rgba(6, 5, 9, 0.88);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .slot-remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(20, 18, 26, 0.85);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 10px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    .slot-remove-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
      transform: scale(1.05);
    }

    .slot-move-btn {
      position: absolute;
      top: 6px;
      right: 34px;
      background: rgba(20, 18, 26, 0.85);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 10px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s ease;
    }
    .slot-move-btn:hover {
      background: var(--gold);
      color: #121118;
      border-color: var(--gold);
      transform: scale(1.05);
    }

    .binder-slot.moving-source {
      border-color: var(--gold) !important;
      box-shadow: 0 0 20px var(--gold) !important;
      animation: pulseMove 1.2s infinite;
    }
    @keyframes pulseMove {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .binder-slot-blank {
      cursor: default;
      background: transparent;
      border: none;
    }
    .binder-slot-blank:hover {
      transform: none;
      box-shadow: none;
      border-color: transparent;
      background: transparent;
    }

    .binder-slot[draggable="true"]:active { cursor: grabbing; }
    .binder-slot[draggable="true"]:hover img { filter: brightness(1.08); }
    .binder-slot img { transition: filter 0.15s ease; }

    .crop-viewport-box {
      position: relative;
      overflow: hidden;
      border: 2px dashed var(--border);
      border-radius: 8px;
      background: #09080d;
      cursor: move;
      user-select: none;
      touch-action: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: width 0.2s ease, height 0.2s ease;
    }

    @media (max-width: 768px) {
      .binder-toolbar {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 12px;
        gap: 10px;
        max-width: 100%;
        margin: 10px 0;
      }
      .binder-toolbar-left, .binder-toolbar-center, .binder-toolbar-right {
        justify-content: center;
        width: 100%;
      }
      .binder-view-toggles { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="side-menu-trigger">
        <button class="hamburger-btn" aria-label="Menu">☰</button>
        <div class="side-menu-panel">
          <a href="binder.html" class="side-menu-link">📁 Binders</a>
          <a href="wishlist.html" class="side-menu-link">❤️ Wishlist</a>
          <a href="collezione.html" class="side-menu-link">★ My Collection</a>
          <div class="mobile-only-menu-items">
            <a href="#" class="side-menu-link" onclick="if(typeof showAboutModal === 'function') showAboutModal()">👤 About</a>
            <a href="#" class="side-menu-link" style="color: var(--danger);" onclick="logoutUser()">🚪 Logout</a>
          </div>
        </div>
      </div>
      <a href="index.html" class="icon-btn" aria-label="Home" title="Home">🏠</a>
      <a href="index.html" class="brand"><span class="dot"></span> Pokyudex</a>
    </div>
    <div class="topbar-right">
      <span id="current-username" class="user-badge"></span>
      <button class="btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div id="main-header-texts">
      <div class="eyebrow">Visual Display</div>
      <h1>Your Binders</h1>
    </div>

    <div class="binder-shelf" id="binder-shelf"></div>

    <div id="active-binder-view" style="display: none;">
      
      <!-- BINDER HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 15px;">
        <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%;">
          <button class="btn" onclick="closeActiveBinder()" style="margin-bottom:12px;">&larr; All Binders</button>
          <div style="display: flex; align-items: center; gap: 10px;">
            <h2 id="active-title" style="margin:0; font-family:'Rajdhani'; font-size:32px;"></h2>
            <button class="icon-btn" title="Edit binder" onclick="openEditBinderModal(currentBinderId)" style="width:34px; height:34px; font-size:14px; flex-shrink:0;">✎</button>
          </div>
        </div>
      </div>

      <!-- BINDER TOOLBAR -->
      <div class="binder-toolbar">
        <div class="binder-toolbar-left">
          <div class="binder-view-toggles" style="display: flex; gap: 6px;">
            <div class="chip active" id="view-single-btn">Single Page</div>
            <div class="chip" id="view-book-btn">Book View (2 Pages)</div>
          </div>
        </div>
        <div class="binder-toolbar-center">
          <button class="btn" id="nav-prev">&larr; Previous</button>
          <span id="page-indicator" style="font-family:'JetBrains Mono'; font-size:13px; color: var(--gold); font-weight:700; padding: 0 10px; white-space: nowrap;">Page 1</span>
          <button class="btn" id="nav-next">Next &rarr;</button>
        </div>
        <div class="binder-toolbar-right">
          <button class="btn binder-delete-btn" style="border-color:var(--danger); color:var(--danger);" onclick="deleteCurrentBinder()">Delete Binder</button>
        </div>
      </div>

      <!-- ALBUM WRAPPER -->
      <div id="binder-view-wrapper"></div>

    </div>
  </div>

  <div id="new-binder-fab" class="compact-upload-trigger-zone" style="z-index: 100;">
    <button class="upload-floating-btn" onclick="openNewBinderModal()" title="Create New Binder">+</button>
  </div>

  <div id="new-binder-modal" class="modal" onclick="closeNewBinderModal()">
    <div class="about-card" onclick="event.stopPropagation()" style="max-width:380px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close" onclick="closeNewBinderModal()">&times;</button>
      <div class="eyebrow" style="color: var(--gold);">New Project</div>
      <h2 style="font-family:'Rajdhani'; font-size:24px; margin: 0 0 16px 0;">Create Binder</h2>
      
      <div class="form-group" style="width:100%; margin:0 0 14px;">
        <label>Binder Name</label>
        <input type="text" id="b-name" placeholder="E.g. Base Set 1999, Shiny, ex..." style="width:100%;" />
      </div>
      
      <div class="form-group" style="width:100%; margin:0 0 14px;">
        <label>Layout Type</label>
        <select id="b-type" style="width:100%;" onchange="document.getElementById('size-selectors').style.display = this.value==='pokedex'?'none':'flex'">
          <option value="custom">Custom Binder</option>
          <option value="pokedex">Master National Pokédex (1025 slots)</option>
        </select>
      </div>
      
      <div id="size-selectors" style="display: flex; gap: 14px; width: 100%; margin: 0 0 14px;">
        <div class="form-group" style="flex:1; margin:0;">
          <label>Rows</label>
          <input type="number" id="b-rows" value="3" min="1" max="5" style="width:100%;" />
        </div>
        <div class="form-group" style="flex:1; margin:0;">
          <label>Columns</label>
          <input type="number" id="b-cols" value="3" min="1" max="5" style="width:100%;" />
        </div>
      </div>

      <div style="display: flex; gap: 14px; width: 100%; margin: 0 0 24px;">
        <div class="form-group" style="flex:1; margin:0;">
          <label style="text-align: center; display: block;">Cover</label>
          <div id="b-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="b-color" value="#4f8bf9" />
        </div>
        <div class="form-group" style="flex:1; margin:0;">
          <label style="text-align: center; display: block;">Inner</label>
          <div id="b-inner-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="b-inner-color" value="#4f8bf9" />
        </div>
        <div class="form-group" style="flex:1; margin:0;">
          <label style="text-align: center; display: block;">Panel</label>
          <div id="b-panel-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="b-panel-color" value="#16141d" />
        </div>
      </div>

      <button class="btn btn-accent" style="width:100%;" onclick="createNewBinder()">Create Album</button>
    </div>
  </div>

  <div id="search-overlay" class="search-overlay">
    <div style="max-width: 1200px; margin: 0 auto; position: relative; min-height: 100%;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 class="hide-on-upload">Select the item to place in Slot <span id="target-slot-title"></span></h2>
        <button class="btn" onclick="closeSearchOverlay()">Close</button>
      </div>

      <div class="compact-upload-trigger-zone" style="z-index: 1200;">
        <button class="upload-floating-btn" onclick="event.stopPropagation(); toggleUploadFlyout()" title="Upload Custom Photo / Divider">+</button>
        <div class="compact-upload-flyout" id="compact-upload-flyout" onclick="event.stopPropagation()">
          <h3 style="margin: 0 0 12px 0; font-family: 'Rajdhani'; font-size: 16px; color: var(--gold); text-transform: uppercase;">🖼️ Custom Artwork</h3>
          <div class="form-group" style="width:100%; margin-bottom: 8px;">
            <label>Select Photo</label>
            <input type="file" id="modal-custom-file" accept="image/*" style="background: transparent; border: none; padding: 4px 0; color: var(--text); font-size: 12px;" />
          </div>
          <div class="form-group" style="width:100%; margin-bottom: 12px;">
            <label>Dimension Scale</label>
            <select id="modal-custom-span" style="height: 32px; padding: 4px 8px; font-size: 12px;">
              <option value="1">Standard Size (1x1)</option>
              <option value="2">Horizontal Extended (2x1)</option>
              <option value="3">Giant Square (2x2)</option>
            </select>
          </div>
          
          <div id="cropper-ui-container" style="display: none; flex-direction: column; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; margin-bottom: 12px;">
            <div id="crop-viewport" class="crop-viewport-box">
              <img id="crop-preview-img" src="" style="position: absolute; top:0; left:0; transform-origin: top left;" draggable="false" />
            </div>
            <input type="range" id="crop-zoom-slider" min="1" max="4" step="0.01" value="1" style="width: 100%; margin: 0; padding: 0; box-sizing: border-box;" />
          </div>
          
          <button class="btn btn-accent" id="upload-confirm-btn" onclick="uploadCustomImageSlot()" style="height: 34px; padding: 4px; font-size: 12px; width: 100%; display: none; margin-top: 4px;">Add</button>
        </div>
      </div>

      <div class="filters hide-on-upload" id="modal-search-tabs-row" style="position: static; background: none; backdrop-filter: none; border-bottom: none; padding: 10px 0 15px; margin-top: 10px;">
        <div class="chip active" id="modal-tab-collection-btn">★ My Collection</div>
        <div class="chip" id="modal-tab-wishlist-btn">❤️ Add from Wishlist</div>
        <div class="chip" id="modal-tab-database-btn">🔍 Search TCG Database</div>
      </div>

      <div id="modal-collection-fields" class="hide-on-upload" style="display: block; margin-bottom: 16px;">
        <select id="modal-collection-sort-select" class="search-bar" style="margin-top: 0; width: auto; min-width: 240px; height: 41px; padding: 0 14px;">
          <option value="price_desc">Price: Highest First</option>
          <option value="price_asc">Price: Lowest First</option>
          <option value="date_desc">Release Date: Newest First</option>
          <option value="date_asc">Release Date: Oldest First</option>
          <option value="name_asc">Name: A-Z</option>
          <option value="set_asc">Set: A-Z</option>
          <option value="rarity_desc">Rarity: Rarest First</option>
        </select>
      </div>

      <div id="modal-wishlist-fields" class="hide-on-upload" style="display: none; margin-bottom: 16px;">
        <select id="modal-wishlist-sort-select" class="search-bar" style="margin-top: 0; width: auto; min-width: 240px; height: 41px; padding: 0 14px;">
          <option value="price_desc">Price: Highest First</option>
          <option value="price_asc">Price: Lowest First</option>
          <option value="date_desc">Release Date: Newest First</option>
          <option value="date_asc">Release Date: Oldest First</option>
          <option value="name_asc">Name: A-Z</option>
          <option value="set_asc">Set: A-Z</option>
          <option value="rarity_desc">Rarity: Rarest First</option>
        </select>
      </div>

      <div id="modal-database-fields" class="hide-on-upload" style="display: none;">
        <input type="text" class="search-bar" id="modal-card-search" placeholder="Type the Pokémon name..." style="max-width:100%; margin-top: 0; margin-bottom:10px;" />
        <div style="display:flex; flex-wrap: wrap; gap:10px; margin-bottom:16px;">
          <select id="modal-set-select" class="search-bar" style="margin-top:0; width:auto; min-width:180px; max-width:250px; height:41px; padding:0 14px; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">
            <option value="">-- Any Set --</option>
          </select>
          <select id="modal-rarity-select" class="search-bar" style="margin-top:0; width:auto; min-width:180px; height:41px; padding:0 14px;">
            <option value="">-- Any Rarity --</option>
          </select>
          <select id="modal-type-select" class="search-bar" style="margin-top:0; width:auto; min-width:150px; height:41px; padding:0 14px;">
            <option value="">-- Any Type --</option>
          </select>
          <select id="modal-database-sort-select" class="search-bar" style="margin-top:0; width:auto; min-width:180px; height:41px; padding:0 14px;">
            <option value="price_desc">Price: Highest First</option>
            <option value="price_asc">Price: Lowest First</option>
            <option value="date_desc">Release Date: Newest First</option>
            <option value="date_asc">Release Date: Oldest First</option>
            <option value="name_asc">Name: A-Z</option>
            <option value="rarity_desc">Rarity: Rarest First</option>
          </select>
        </div>
        <div id="search-history-row" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px;"></div>
      </div>

      <div id="modal-results-container" class="hide-on-upload"></div>
    </div>
  </div>

  <div id="edit-binder-modal" class="modal" onclick="closeEditBinderModal()">
    <div class="about-card" onclick="event.stopPropagation()" style="max-width:360px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close" onclick="closeEditBinderModal()">&times;</button>
      <div class="eyebrow" style="color: var(--gold);">Edit Binder</div>

      <div class="form-group" style="width:100%; margin:14px 0;">
        <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; margin-bottom:6px;">Name</label>
        <input type="text" id="edit-b-name" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);" />
      </div>

      <div style="display:flex; gap: 14px; width: 100%; margin: 0 0 24px;">
        <div class="form-group" style="flex:1; margin:0;">
          <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; text-align:center; margin-bottom:6px;">Cover</label>
          <div id="edit-b-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="edit-b-color" />
        </div>
        <div class="form-group" style="flex:1; margin:0;">
          <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; text-align:center; margin-bottom:6px;">Inner</label>
          <div id="edit-b-inner-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="edit-b-inner-color" />
        </div>
        <div class="form-group" style="flex:1; margin:0;">
          <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; text-align:center; margin-bottom:6px;">Panel</label>
          <div id="edit-b-panel-color-picker" style="display:flex; justify-content:center;"></div>
          <input type="hidden" id="edit-b-panel-color" />
        </div>
      </div>

      <button class="btn btn-accent" style="width:100%;" onclick="saveEditBinder()">Save Changes</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const DEFAULT_BINDER_PALETTE = [

    function hexToRgba(hex, alpha) {
      const c = (hex || '#f0b93d').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) || 0;
      const g = parseInt(c.substring(2, 4), 16) || 0;
      const b = parseInt(c.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function hexToHsl(hex) {
      const c = (hex || '#4f8bf9').replace('#', '');
      const r = parseInt(c.substring(0, 2), 16) / 255;
      const g = parseInt(c.substring(2, 4), 16) / 255;
      const b = parseInt(c.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
          case r: h = ((g - b) / d) % 6; break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function applyBinderTheme(b) {

      const innerHsl = hexToHsl(b.inner_color || b.color);
      const panelHsl = hexToHsl(b.panel_color || '#16141d');
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const dotColor = `hsl(${coverHsl.h}, ${clamp(coverHsl.s + 10, 0, 100)}%, ${clamp(coverHsl.l + 8, 25, 78)}%)`;
      document.documentElement.style.setProperty('--dot-color', dotColor);
      renderBloomLayer([coverHsl, innerHsl, panelHsl]);
    }

    function getSlotsCovered(slotNum, span, numCols, numRows) {
      const slotsPerPage = numCols * numRows;
      const pageStart = Math.floor((slotNum - 1) / slotsPerPage) * slotsPerPage;
      const localIdx = (slotNum - 1) % slotsPerPage;
      const row = Math.floor(localIdx / numCols);
      const col = localIdx % numCols;

      if (span === 1 || !span) {
        return [slotNum];
      }
      if (span === 2) { 
        if (col + 1 >= numCols) return null; 
        return [slotNum, slotNum + 1];
      }
      if (span === 3) { 
        if (col + 1 >= numCols || row + 1 >= numRows) return null; 
        return [slotNum, slotNum + 1, slotNum + numCols, slotNum + numCols + 1];
      }
      return null;
    }

    function checkBinderValidity(slotsCopy, numCols, numRows) {
      let occupancy = {};
      for (let sNum in slotsCopy) {
        let card = slotsCopy[sNum];
        if (!card) continue;
        let start = parseInt(sNum);
        let covered = getSlotsCovered(start, card.slot_span || 1, numCols, numRows);
        if (covered === null) return false; 
        for (let slot of covered) {
          if (occupancy[slot] !== undefined) return false; 
          occupancy[slot] = start;
        }
      }
      return true;
    }

    function adjustSlotForSpan(slotNum, span, numCols, numRows) {
      const slotsPerPage = numCols * numRows;
      let pageStart = Math.floor((slotNum - 1) / slotsPerPage) * slotsPerPage;
      let localIdx = (slotNum - 1) % slotsPerPage;
      let row = Math.floor(localIdx / numCols);
      let col = localIdx % numCols;

      if (span === 2 || span === 3) { 
        if (col === numCols - 1 && numCols > 1) { col--; }
      }
      if (span === 3) { 
        if (row === numRows - 1 && numRows > 1) { row--; }
      }
      return pageStart + (row * numCols) + col + 1;
    }

    async function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.boxShadow = '';
      
      let sourceSlotNum = parseInt(e.dataTransfer.getData('text/plain'));
      if (isNaN(sourceSlotNum) && window.draggedSourceSlotNum !== undefined) {
        sourceSlotNum = window.draggedSourceSlotNum;
      }
      
      let targetSlotNum = parseInt(e.currentTarget.dataset.slot);
      if (!sourceSlotNum || isNaN(targetSlotNum)) return;

      executeMoveOrSwapSlots(sourceSlotNum, targetSlotNum);
    }

    async function executeMoveOrSwapSlots(sourceSlotNum, targetSlotNum) {
      const b = currentBinderData.binder;
      const numCols = parseInt(b.cols) || 3;
      const numRows = parseInt(b.rows) || 3;

      const sourceCard = currentBinderData.slots[sourceSlotNum];
      if (!sourceCard) { renderActiveGrid(); return; }

      const spanValue = sourceCard.slot_span || 1;
      let finalTargetSlotNum = adjustSlotForSpan(targetSlotNum, spanValue, numCols, numRows);
      if (sourceSlotNum === finalTargetSlotNum) { renderActiveGrid(); return; }

      const targetCard = currentBinderData.slots[finalTargetSlotNum];
      let simulatedSlots = { ...currentBinderData.slots };
      delete simulatedSlots[sourceSlotNum];
      delete simulatedSlots[finalTargetSlotNum];

      if (sourceCard) simulatedSlots[finalTargetSlotNum] = { ...sourceCard, slot_number: finalTargetSlotNum };
      if (targetCard) simulatedSlots[sourceSlotNum] = { ...targetCard, slot_number: sourceSlotNum };

      if (!checkBinderValidity(simulatedSlots, numCols, numRows)) {
        renderActiveGrid();
        return;
      }

      try {
        currentBinderData.slots = simulatedSlots;
        renderActiveGrid();

        await Promise.all([
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_number: sourceSlotNum,
              card_id: targetCard ? (targetCard.card_id || null) : null,
              custom_image_url: targetCard ? (targetCard.custom_image_url || null) : null,
              slot_span: targetCard ? (targetCard.slot_span || 1) : 1
            })
          }),
          api(`/api/binders/${currentBinderId}/slots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_number: finalTargetSlotNum,
              card_id: sourceCard.card_id || null,
              custom_image_url: sourceCard.custom_image_url || null,
              slot_span: spanValue
            })
          })
        ]);
      } catch (err) {
        alert("Unable to complete the move: " + err.message);
        openBinder(currentBinderId, true);
      }
    }

    const SEARCH_HISTORY_KEY = 'pokyudex_binder_search_history';
    const SEARCH_HISTORY_MAX = 5;

    function getSearchHistory() {
      try {
        const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    }

    function addToSearchHistory(query) {
      const q = query.trim();
      if (q.length < 1) return;
      
      let history = getSearchHistory();
      const newQuery = q.toLowerCase();
      
      if (history.some(h => h.toLowerCase().startsWith(newQuery))) return;
      history = history.filter(h => h.toLowerCase() !== newQuery && !newQuery.startsWith(h.toLowerCase()));
      
      history.unshift(q);
      history = history.slice(0, SEARCH_HISTORY_MAX);
      try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history)); } catch (e) { }
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const row = document.getElementById('search-history-row');
      const history = getSearchHistory();
      if (!history.length) { row.innerHTML = ''; return; }

      row.innerHTML = `<span style="font-family:'JetBrains Mono'; font-size:11px; color:var(--text-muted); align-self:center; margin-right:4px;">Recent:</span>`;
      history.forEach(term => {

    async function execOverlaySearch() {
      const q = document.getElementById('modal-card-search').value.trim();
      const rarity = document.getElementById('modal-rarity-select').value;
      const type = document.getElementById('modal-type-select').value;
      const setId = document.getElementById('modal-set-select').value;
      const b = currentBinderData.binder;
      const container = document.getElementById('modal-results-container');
      
      container.innerHTML = '<div class="state-msg"><span class="spinner"></span>Searching the Pokédex...</div>';
      
      let url = `/api/cards/search?`;
      if (b && b.type === 'pokedex') {
        url += `pokedex_number=${targetSlotNumber}`;
        if (q) url += `&name=${encodeURIComponent(q)}`;
      } else {
        if (q.length < 1 && !rarity && !type && !setId) {
          container.innerHTML = '<div class="state-msg">Type at least 1 letter, or pick a set/rarity/type, to search...</div>';
          return;
        }
        url += `name=${encodeURIComponent(q.length >= 1 ? q : '')}`;
      }
      if (rarity) url += `&rarity=${encodeURIComponent(rarity)}`;
      if (type) url += `&type=${encodeURIComponent(type)}`;
      if (setId) url += `&set_id=${encodeURIComponent(setId)}`;
      
      try {
        const cards = await api(url);
        container.innerHTML = '';
        if (!cards || cards.length === 0) {
          container.innerHTML = '<div class="state-msg">No cards found. Try a different name or wait for sync.</div>';
          return;
        }

        if (q.length >= 1) { addToSearchHistory(q); }

        const criteria = document.getElementById('modal-database-sort-select').value;
        cards.sort((a, b) => {
          if (criteria === 'price_desc') return (b.price_market ?? -1) - (a.price_market ?? -1);
          if (criteria === 'price_asc') return (a.price_market ?? Infinity) - (b.price_market ?? Infinity);
          if (criteria === 'date_desc') return (b.release_date || "").localeCompare(a.release_date || "");
          if (criteria === 'date_asc') return (a.release_date || "").localeCompare(b.release_date || "");
          if (criteria === 'name_asc') return (a.name || "").localeCompare(b.name || "");
          if (criteria === 'rarity_desc') {
            let idxA = RARITY_RANKING.findIndex(r => r.toLowerCase() === (a.rarity || "").toLowerCase());
            let idxB = RARITY_RANKING.findIndex(r => r.toLowerCase() === (b.rarity || "").toLowerCase());
            return idxB - idxA;
          }
          return 0;
        });

        const grid = document.createElement('div');
        grid.className = 'cards-grid';
        cards.forEach(c => {
          const tile = document.createElement('div');
          tile.className = 'card-tile';
          tile.onclick = () => { assignCardToSlot(c.id); };
          const priceLabel = c.price_market ? formatPrice(c.price_market, c.currency) : 'n/a';

          tile.innerHTML = `
            <img src="${escapeHtml(c.image_small)}" alt="${escapeHtml(c.name)}" loading="lazy">
            <div class="card-info">
              <div class="card-name">${escapeHtml(c.name)} (${escapeHtml(c.card_number)})</div>
              <div class="card-rarity set-name-link" title="Go to ${escapeHtml(c.set_name || 'Set')}" style="color:var(--teal); text-transform:none; cursor:pointer;" onclick="event.stopPropagation(); window.location.href='set.html?id=${encodeURIComponent(c.set_id)}&focus=${encodeURIComponent(c.id)}'">${escapeHtml(c.set_name || 'Unknown set')}</div>
              <div class="card-rarity">${escapeHtml(c.rarity || 'Rarity n/a')}</div>
              <div style="font-family:'JetBrains Mono'; font-size:10px; color:var(--gold); margin-top:4px;">${priceLabel}</div>
            </div>
          `;
          grid.appendChild(tile);
        });
        container.appendChild(grid);
      } catch (err) {
        container.innerHTML = `<div class="state-msg error">Connection error: ${err.message}</div>`;
      }
    }

    function createBlankPageHTML(slotsCount, b, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      grid.style.background = 'transparent';
      grid.style.border = 'none';
      grid.style.boxShadow = 'none';
      const slotWidth = isBookMode ? '170px' : '180px';
      grid.style.margin = '0';
      grid.style.gridTemplateColumns = `repeat(${b.cols}, ${slotWidth})`;
      for (let i = 0; i < slotsCount; i++) {
        const tile = document.createElement('div');
        tile.className = 'binder-slot binder-slot-blank';
        tile.style.width = slotWidth;
        grid.appendChild(tile);
      }
      return grid;
    }

    function createGridHTML(startSlot, slotsCount, b, slots, isBookMode) {
      const grid = document.createElement('div');
      grid.className = 'binder-grid';
      grid.style.background = b.panel_color || '#16141d';
      
      const isMobile = window.innerWidth <= 768;
      const numCols = parseInt(b.cols) || 3; 

      if (isMobile) {
        grid.style.margin = '0 auto';
        grid.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
      } else {
        const baseWidth = isBookMode ? 170 : 180;
        grid.style.margin = isBookMode ? '0' : '24px auto';
        grid.style.gridTemplateColumns = `repeat(${numCols}, ${baseWidth}px)`;
      }

      let skippedSlots = new Set();

      for (let i = 0; i < slotsCount; i++) {
        const slotNum = startSlot + i;
        if (b && b.type === 'pokedex' && slotNum > 1025) break;
        if (skippedSlots.has(slotNum)) continue;

        const cardData = slots[slotNum];
        const span = (cardData && cardData.slot_span) ? cardData.slot_span : 1;
        
        if (span === 2) skippedSlots.add(slotNum + 1);
        else if (span === 3) {
          skippedSlots.add(slotNum + 1);
          skippedSlots.add(slotNum + numCols);
          skippedSlots.add(slotNum + numCols + 1);
        }

        const tile = document.createElement('div');
        tile.className = 'binder-slot';
        if (activeMovingSlot === slotNum) {
          tile.classList.add('moving-source');
        }
        tile.dataset.slot = slotNum;
        
        if (isMobile) {
            if (span === 2) { 
              tile.style.gridColumn = `span ${Math.min(2, numCols)}`; 
              tile.style.setProperty('--mobile-aspect', '134 / 88');
            } 
            else if (span === 3) { 
              tile.style.gridColumn = `span ${Math.min(2, numCols)}`; 
              tile.style.gridRow = "span 2"; 
              tile.style.setProperty('--mobile-aspect', '63 / 88');
            } else {
              tile.style.setProperty('--mobile-aspect', '63 / 88');
            }
        } else {
            const baseWidth = isBookMode ? 170 : 180;
            const baseHeight = Math.floor(baseWidth * 88 / 63);
            if (span === 2) {
              tile.style.gridColumn = "span 2";
              tile.style.width = (baseWidth * 2 + 16) + "px"; 
              tile.style.height = baseHeight + "px";
            } else if (span === 3) {
              tile.style.gridColumn = "span 2";
              tile.style.gridRow = "span 2";
              tile.style.width = (baseWidth * 2 + 16) + "px"; 
              tile.style.height = (baseHeight * 2 + 16) + "px"; 
            } else {
              tile.style.width = baseWidth + "px";
              tile.style.height = baseHeight + "px";
            }
        }
        
        tile.addEventListener('dragover', handleDragOver);
        tile.addEventListener('drop', handleDrop);
        
        tile.onclick = () => {
          if (activeMovingSlot !== null) {
            executeMoveOrSwapSlots(activeMovingSlot, slotNum);
            activeMovingSlot = null;
          } else if (!cardData) {
            openSearchOverlay(slotNum);
          }
        };

        tile.innerHTML = `<div class="slot-number">#${slotNum}</div>`;
        
        if (cardData) {
          tile.setAttribute('draggable', 'true');
          tile.addEventListener('dragstart', handleDragStart);
          let startX = 0, startY = 0;
          tile.addEventListener('pointerdown', (e) => { startX = e.clientX; startY = e.clientY; });
          tile.addEventListener('pointerup', (e) => {
            if (e.target.closest('.slot-remove-btn') || e.target.closest('.slot-move-btn')) return; 
            
            if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
              if (activeMovingSlot !== null) return;
              window.openGlobalCardModal(
                cardData, 
                cardData.custom_image_url || cardData.image_large || cardData.image_small, 
                cardData.custom_image_url ? 'Custom Content' : formatPrice(cardData.price_market, cardData.currency),
                cardData.rarity
              );
            }
          });
          
          const imgUrl = cardData.custom_image_url || cardData.image_small;
          tile.innerHTML += `
            <button class="slot-remove-btn" onclick="event.stopPropagation(); clearSlot(${slotNum})">❌</button>
            <button class="slot-move-btn" title="Move or Swap card" onclick="startCardMove(${slotNum}, event)">🔄</button>
            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(cardData.name || 'Card')}" draggable="false" style="pointer-events: none; object-fit: cover; width:100%; height:100%;">
          `;
        } else {
          tile.removeAttribute('draggable');
          tile.innerHTML += `<div style="color:var(--text-muted); font-size:24px; font-weight:bold;">+</div>`;
        }
        grid.appendChild(tile);
      }
      return grid;
    }

    function renderActiveGrid() {
      const wrapper = document.getElementById('binder-view-wrapper');
      const b = currentBinderData.binder;
      const slots = currentBinderData.slots;
      const slotsPerPage = b.rows * b.cols;
      wrapper.innerHTML = '';

      const accentHex = b.inner_color || b.color;
      wrapper.style.setProperty('--binder-accent', accentHex);
      wrapper.style.setProperty('--binder-accent-bg', hexToRgba(accentHex, 0.08));
      wrapper.style.setProperty('--binder-accent-glow', hexToRgba(accentHex, 0.28));

      const albumBackground = `linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.55) 100%), ${b.inner_color || b.color}`;
      const albumBoxShadow = `0 35px 80px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04)`;
      const albumBorder = `6px solid rgba(255, 255, 255, 0.08)`;

      if (viewMode === 'single') {
        const startSlot = ((currentPage - 1) * slotsPerPage) + 1;
        document.getElementById('page-indicator').textContent = `Page ${currentPage} (Slots ${startSlot}-${b.type==='pokedex'?Math.min(startSlot+slotsPerPage-1, 1025):startSlot+slotsPerPage-1})`;
        
        const singleSpread = document.createElement('div');
        singleSpread.className = 'binder-book-spread';
        singleSpread.style.background = albumBackground;
        singleSpread.style.boxShadow = albumBoxShadow;
        singleSpread.style.border = albumBorder;
        
        const grid = createGridHTML(startSlot, slotsPerPage, b, slots, false);
        singleSpread.appendChild(grid);
        wrapper.appendChild(singleSpread);
        
      } else {
        const isCoverSpread = currentPage === 1;
        const pageLeft = isCoverSpread ? null : currentPage;
        const pageRight = isCoverSpread ? 1 : currentPage + 1;
        const startSlotRight = ((pageRight - 1) * slotsPerPage) + 1;
        const rightExists = b.type !== 'pokedex' || startSlotRight <= 1025;

        document.getElementById('page-indicator').textContent = isCoverSpread
          ? `Page 1 (Cover)`
          : `Pages ${pageLeft}-${pageRight}`;

        const bookSpread = document.createElement('div');
        bookSpread.className = 'binder-book-spread';
        bookSpread.style.background = albumBackground;
        bookSpread.style.boxShadow = albumBoxShadow;
        bookSpread.style.border = albumBorder;

        if (isCoverSpread) {
          const blankContainer = document.createElement('div');
          blankContainer.className = 'binder-page-side';
          blankContainer.appendChild(createBlankPageHTML(slotsPerPage, b, true));
          bookSpread.appendChild(blankContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        } else {
          const startSlotLeft = ((pageLeft - 1) * slotsPerPage) + 1;
          const leftContainer = document.createElement('div');
          leftContainer.className = 'binder-page-side';
          const leftBadge = document.createElement('div');
          leftBadge.className = 'page-title-badge';
          leftBadge.textContent = `PAGE ${pageLeft} (Slots ${startSlotLeft}-${b.type==='pokedex'?Math.min(startSlotLeft+slotsPerPage-1, 1025):startSlotLeft+slotsPerPage-1})`;
          leftContainer.appendChild(leftBadge);
          leftContainer.appendChild(createGridHTML(startSlotLeft, slotsPerPage, b, slots, true));
          bookSpread.appendChild(leftContainer);

          const spine = document.createElement('div');
          spine.className = 'binder-spine';
          bookSpread.appendChild(spine);
        }

        if (rightExists) {
          const rightContainer = document.createElement('div');
          rightContainer.className = 'binder-page-side';
          const rightBadge = document.createElement('div');
          rightBadge.className = 'page-title-badge';
          rightBadge.textContent = isCoverSpread
            ? `COVER — PAGE 1 (Slots 1-${b.type==='pokedex'?Math.min(slotsPerPage, 1025):slotsPerPage})`
            : `PAGE ${pageRight} (Slots ${startSlotRight}-${b.type==='pokedex'?Math.min(startSlotRight+slotsPerPage-1, 1025):startSlotRight+slotsPerPage-1})`;
          rightContainer.appendChild(rightBadge);
          rightContainer.appendChild(createGridHTML(startSlotRight, slotsPerPage, b, slots, true));
          bookSpread.appendChild(rightContainer);
        }
        wrapper.appendChild(bookSpread);
      }
    }

    function doNavPrev() {
      if (viewMode === 'single') {
        if (currentPage > 1) { currentPage--; renderActiveGrid(); }
      } else {
        if (currentPage === 2) { currentPage = 1; renderActiveGrid(); }
        else if (currentPage > 2) { currentPage -= 2; renderActiveGrid(); }
      }
    }

    function doNavNext() {
      const b = currentBinderData.binder;
      const pokedexMaxPage = 114; 
      if (viewMode === 'single') {
        if (b.type === 'pokedex' && currentPage >= pokedexMaxPage) return;
        currentPage++;
        renderActiveGrid();
      } else {
        const nextLeft = currentPage === 1 ? 2 : currentPage + 2;
        if (b.type === 'pokedex' && nextLeft > pokedexMaxPage) return;
        currentPage = nextLeft;
        renderActiveGrid();
      }
    }

    document.getElementById('nav-prev').onclick = doNavPrev;
    document.getElementById('nav-next').onclick = doNavNext;

    let touchStartX = 0;
    let touchEndX = 0;
    const binderWrapper = document.getElementById('binder-view-wrapper');

    binderWrapper.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    binderWrapper.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeThreshold = 40;
      if (touchEndX < touchStartX - swipeThreshold) { doNavNext(); }
      if (touchEndX > touchStartX + swipeThreshold) { doNavPrev(); }
    }

    const fileInput = document.getElementById('modal-custom-file');
    const cropperContainer = document.getElementById('cropper-ui-container');
    const cropPreviewImg = document.getElementById('crop-preview-img');
    const cropZoomSlider = document.getElementById('crop-zoom-slider');
    const uploadConfirmBtn = document.getElementById('upload-confirm-btn');
    const spanSelect = document.getElementById('modal-custom-span');
    const viewportBox = document.getElementById('crop-viewport');
    
    let currentImageFile = null;
    let imgNaturalWidth = 0;
    let imgNaturalHeight = 0;
    
    let cropX = 0;
    let cropY = 0;
    let cropScale = 1;
    let isDraggingCrop = false;
    let startDragX = 0;
    let startDragY = 0;
    let startCropX = 0;
    let startCropY = 0;

    function updateViewportSize() {
      const span = parseInt(spanSelect.value) || 1;
      let vpWidth = 126;
      let vpHeight = 176;
      
      if (span === 2) {
         vpWidth = 126 * 2 + 16;
         vpHeight = 176;
      } else if (span === 3) {
         vpWidth = 126 * 2 + 16;
         vpHeight = 176 * 2 + 16;
      }
      
      if (viewportBox) {
        viewportBox.style.width = vpWidth + 'px';
        viewportBox.style.height = vpHeight + 'px';
      }
      updatePreviewTransform();
    }

    if (spanSelect) spanSelect.addEventListener('change', () => {
      updateViewportSize();
      if(currentImageFile && imgNaturalWidth > 0 && imgNaturalHeight > 0) {
        const vpRect = viewportBox.getBoundingClientRect();
        const scaleX = vpRect.width / imgNaturalWidth;
        const scaleY = vpRect.height / imgNaturalHeight;
        cropScale = Math.max(scaleX, scaleY);
        cropZoomSlider.min = cropScale / 2;
        cropZoomSlider.max = cropScale * 3;
        cropZoomSlider.value = cropScale;
        cropX = 0;
        cropY = 0;
        updatePreviewTransform();
      }
    });

    if (fileInput) fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file.');
        fileInput.value = '';
        return;
      }
      
      currentImageFile = file;
      
      if (cropPreviewImg.src && cropPreviewImg.src.startsWith('blob:')) {
         URL.revokeObjectURL(cropPreviewImg.src);
      }
      
      const url = URL.createObjectURL(file);
      cropPreviewImg.onload = () => {
        imgNaturalWidth = cropPreviewImg.naturalWidth;
        imgNaturalHeight = cropPreviewImg.naturalHeight;
        
        if(cropperContainer) cropperContainer.style.display = 'flex';
        if(uploadConfirmBtn) uploadConfirmBtn.style.display = 'block';

        updateViewportSize();
        
        const vpRect = viewportBox.getBoundingClientRect();
        const scaleX = vpRect.width / imgNaturalWidth;
        const scaleY = vpRect.height / imgNaturalHeight;
        cropScale = Math.max(scaleX, scaleY);
        
        if (cropZoomSlider) {
          cropZoomSlider.min = cropScale / 2;
          cropZoomSlider.max = cropScale * 3;
          cropZoomSlider.value = cropScale;
        }
        
        cropX = 0;
        cropY = 0;
        updatePreviewTransform();
        
        fileInput.value = ''; 
      };
      cropPreviewImg.src = url;
    });

    if (cropZoomSlider) cropZoomSlider.addEventListener('input', (e) => {
      cropScale = parseFloat(e.target.value);
      updatePreviewTransform();
    });

    function updatePreviewTransform() {
      if(cropPreviewImg) {
        cropPreviewImg.style.transform = `translate(${cropX}px, ${cropY}px) scale(${cropScale})`;
      }
    }

    if (viewportBox) {
      viewportBox.addEventListener('pointerdown', (e) => {
        isDraggingCrop = true;
        startDragX = e.clientX;
        startDragY = e.clientY;
        startCropX = cropX;
        startCropY = cropY;
        viewportBox.setPointerCapture(e.pointerId);
      });

      viewportBox.addEventListener('pointermove', (e) => {
        if (!isDraggingCrop) return;
        cropX = startCropX + (e.clientX - startDragX);
        cropY = startCropY + (e.clientY - startDragY);
        updatePreviewTransform();
      });

      viewportBox.addEventListener('pointerup', (e) => {
        isDraggingCrop = false;
        try { viewportBox.releasePointerCapture(e.pointerId); } catch(err){}
      });
    }

    async function uploadCustomImageSlot() {
      if (!currentImageFile) return;
      
      const span = parseInt(spanSelect.value) || 1;
      
      if(uploadConfirmBtn) {
        uploadConfirmBtn.disabled = true;
        uploadConfirmBtn.textContent = 'Uploading...';
      }
      
      const canvas = document.createElement('canvas');
      const vpRect = viewportBox.getBoundingClientRect();
      canvas.width = vpRect.width * 2; 
      canvas.height = vpRect.height * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      
      ctx.drawImage(cropPreviewImg, cropX, cropY, imgNaturalWidth * cropScale, imgNaturalHeight * cropScale);
      
      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('file', blob, 'custom_image.png');
        
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          if (res.status === 401) {
             window.location.href = 'login.html';
             return;
          }
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          
          const imageUrl = data.url;
          
          await api(`/api/binders/${currentBinderId}/slots`, {
             method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({
               slot_number: targetSlotNumber,
               card_id: null,
               custom_image_url: imageUrl,
               slot_span: span
             })
          });
          
          closeSearchOverlay();
          openBinder(currentBinderId, true);
          
        } catch (err) {
          alert('Upload Error: ' + err.message);
        } finally {
          if(uploadConfirmBtn) {
            uploadConfirmBtn.disabled = false;
            uploadConfirmBtn.textContent = 'Add';
            uploadConfirmBtn.style.display = 'none';
          }
          if(fileInput) fileInput.value = '';
          if(cropperContainer) cropperContainer.style.display = 'none';
          currentImageFile = null;
        }
      }, 'image/png');
    }

    requireAuth().then(user => { if (user) loadBinders(); });
  </script>
</body>
