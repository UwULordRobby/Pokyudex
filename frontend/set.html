<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokyudex — Set</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="side-menu-trigger">
        <button class="hamburger-btn" aria-label="Menu">☰</button>
        <div class="side-menu-panel">
          <a href="binder.html" class="side-menu-link">📁 Binders</a>
          <a href="wishlist.html" class="side-menu-link">❤️ Wishlist</a>
          <a href="collezione.html" class="side-menu-link">★ My Collection</a>
          <div class="mobile-only-menu-items">
            <a href="#" class="side-menu-link" onclick="if(typeof showAboutModal === 'function') showAboutModal()">👤 About</a>
            <a href="#" class="side-menu-link" style="color: var(--danger);" onclick="logoutUser()">🚪 Logout</a>
          </div>
        </div>
      </div>
      <a href="index.html" class="icon-btn" aria-label="Home" title="Home">🏠</a>
      <a href="index.html" class="brand"><span class="dot"></span> Pokyudex</a>
    </div>
    <div class="topbar-right">
      <button class="btn" id="admin-refresh-set-btn" style="display:none;" title="Force update this set from API">🔄 Refresh Set</button>
      <button class="btn" id="about-btn" title="About the creator">👤 About</button>
      <span id="current-username" class="user-badge"></span>
      <button class="btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="header-row">
      <div>
        <div class="eyebrow" id="set-series"></div>
        <h1 id="set-name">Loading...</h1>
      </div>
      
      <div class="mobile-search-row" style="display:flex; gap:10px; align-items:center; flex-wrap: wrap; justify-content: flex-end;">
        <input type="text" id="name-search" class="search-bar" placeholder="Search Pokémon..." style="margin-top: 0; height: 41px; padding: 0 14px; width: auto; min-width: 200px;" />
        <select id="type-select" class="search-bar" style="margin-top: 0; height: 41px; padding: 0 14px; width: auto; min-width: 160px;">
          <option value="">-- Any Type --</option>
        </select>
        <select id="sort-select" class="search-bar" style="margin-top: 0; height: 41px; padding: 0 14px; width: auto; min-width: 220px;">
          <option value="price_desc">Price: highest first</option>
          <option value="price_asc">Price: lowest first</option>
          <option value="rarity_desc">Rarity: rarest first</option>
          <option value="rarity_asc">Rarity: least rare first</option>
        </select>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div id="cards-container">
      <div class="state-msg"><span class="spinner"></span>Loading cards...</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const setId = params.get('id');
    let allCards = [];
    let activeRarities = new Set();
    let usdToEurRate = 0.92;

    const RARITY_ORDER = [
      "Common", "Uncommon", "Promo", "Classic Collection", "Rare", "Rare Holo", "Rare BREAK",
      "Rare Holo EX", "Rare Holo GX", "Rare Holo LV.X", "Rare Holo V", "Rare Holo VMAX",
      "Rare Holo VSTAR", "Double Rare", "Ultra Rare", "Amazing Rare", "Radiant Rare",
      "Illustration Rare", "Special Illustration Rare", "MEGA_ATTACK_RARE", "Mega Attack Rare",
      "Mega Hyper Rare", "Trainer Gallery Rare Holo", "Shiny Rare", "Shiny Ultra Rare",
      "ACE SPEC Rare", "Black White Rare", "Rare Secret", "Secret Rare", "Rare Rainbow", "Hyper Rare"
    ];

    if (!setId) {
      document.getElementById('cards-container').innerHTML = '<div class="state-msg error">No set specified.</div>';
      throw new Error('missing set id');
    }

    async function loadExchangeRate() {
      try {
        const data = await api('/api/exchange-rate');
        usdToEurRate = data.usd_to_eur;
      } catch (err) { console.error('Unable to load exchange rate:', err); }
    }

    function hashHue(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash) % 360;
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        switch (max) {
          case r: h = ((g - b) / d) % 6; break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

    function applyPageTheme(palette) {
      const primary = palette[0];
      const dotColor = `hsl(${primary.h}, ${clamp(primary.s + 10, 0, 100)}%, ${clamp(primary.l + 8, 25, 78)}%)`;
      document.documentElement.style.setProperty('--dot-color', dotColor);
      renderBloomLayer(palette);
    }

    function extractPalette(imgUrl, count = 4) {
      return new Promise((resolve, reject) => {
        if (!imgUrl) { reject(new Error('no image')); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const size = 50;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;

            const bucketSize = 24;
            const buckets = new Map();
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
              if (a < 200) continue;
              const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
              if (luminance > 245 || luminance < 12) continue;

              const key = `${Math.round(r / bucketSize)}-${Math.round(g / bucketSize)}-${Math.round(b / bucketSize)}`;
              const bucket = buckets.get(key) || { r: 0, g: 0, b: 0, count: 0 };
              bucket.r += r; bucket.g += g; bucket.b += b; bucket.count++;
              buckets.set(key, bucket);
            }
            if (!buckets.size) { reject(new Error('no usable pixels')); return; }

            const sorted = [...buckets.values()].sort((a, b) => b.count - a.count);
            const palette = [];
            for (const bucket of sorted) {
              const color = rgbToHsl(
                Math.round(bucket.r / bucket.count),
                Math.round(bucket.g / bucket.count),
                Math.round(bucket.b / bucket.count)
              );
              const tooClose = palette.some(p => Math.abs(p.h - color.h) < 18 && Math.abs(p.l - color.l) < 12);
              if (!tooClose) palette.push(color);
              if (palette.length >= count) break;
            }
            if (!palette.length) { reject(new Error('no distinct colors')); return; }
            resolve(palette);
          } catch (e) {
            reject(e);
          }
        };
        img.onerror = () => reject(new Error('image failed to load'));
        img.src = imgUrl;
      });
    }

    async function setPageThemeFromCards(cards) {
      const fallbackHue = hashHue(setId);
      const fallbackPalette = [
        { h: fallbackHue, s: 65, l: 55 },
        { h: (fallbackHue + 25) % 360, s: 60, l: 45 },
        { h: (fallbackHue - 20 + 360) % 360, s: 55, l: 62 },
      ];
      if (!cards || !cards.length) { applyPageTheme(fallbackPalette); return; }

      const priciest = [...cards].sort((a, b) => {
        const getPriceInEur = (card) => {
          if (card.price_market == null) return -1;
          return card.currency === 'USD' ? card.price_market * usdToEurRate : card.price_market;
        };
        return getPriceInEur(b) - getPriceInEur(a);
      })[0];
      const imgUrl = priciest && (priciest.image_large || priciest.image_small);

      try {
        const palette = await extractPalette(imgUrl, 4);
        applyPageTheme(palette);
      } catch (e) {
        applyPageTheme(fallbackPalette);
      }
    }

    function renderFilters(rarities) {
      const el = document.getElementById('filters');
      el.innerHTML = '';
      
      const desktopDiv = document.createElement('div');
      desktopDiv.className = 'desktop-rarity-chips';

      const mobileSelect = document.createElement('select');
      mobileSelect.className = 'search-bar mobile-rarity-select';
      mobileSelect.style.marginTop = '0';
      mobileSelect.style.marginBottom = '14px';

      const optAll = document.createElement('option');
      optAll.value = "ALL";
      optAll.textContent = "All Rarities";
      mobileSelect.appendChild(optAll);

      rarities.forEach((r) => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        if (activeRarities.has(r)) opt.selected = true;
        mobileSelect.appendChild(opt);
      });

      mobileSelect.addEventListener('change', (e) => {
        activeRarities.clear();
        if (e.target.value !== "ALL") {
          activeRarities.add(e.target.value);
        }
        renderFilters(rarities);
        renderCards();
      });

      el.appendChild(mobileSelect);

      const allChip = document.createElement('div');
      allChip.className = 'chip' + (activeRarities.size === 0 ? ' active' : '');
      allChip.textContent = 'All';
      allChip.onclick = () => { activeRarities.clear(); renderFilters(rarities); renderCards(); };
      desktopDiv.appendChild(allChip);

      rarities.forEach((r) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (activeRarities.has(r) ? ' active' : '');
        chip.textContent = r;
        chip.onclick = () => { 
            if(activeRarities.has(r)) activeRarities.delete(r);
            else activeRarities.add(r);
            renderFilters(rarities); renderCards(); 
        };
        desktopDiv.appendChild(chip);
      });
      
      if(activeRarities.size > 0) {
          const deselectBtn = document.createElement('div');
          deselectBtn.className = 'chip';
          deselectBtn.style.borderColor = 'var(--danger)';
          deselectBtn.style.color = 'var(--danger)';
          deselectBtn.textContent = '✕ Deselect All';
          deselectBtn.onclick = () => { activeRarities.clear(); renderFilters(rarities); renderCards(); };
          desktopDiv.appendChild(deselectBtn);
      }
      
      el.appendChild(desktopDiv);
    }

    function sortCards(cardsArray, criteria) {
      return [...cardsArray].sort((a, b) => {
        const getPriceInEur = (card) => {
          if (card.price_market == null) return null;
          return card.currency === 'USD' ? card.price_market * usdToEurRate : card.price_market;
        };

        if (criteria === 'price_desc') {
          return (getPriceInEur(b) ?? -1) - (getPriceInEur(a) ?? -1);
        }
        if (criteria === 'price_asc') {
          return (getPriceInEur(a) ?? Infinity) - (getPriceInEur(b) ?? Infinity);
        }
        if (criteria === 'rarity_desc') {
          let idxA = RARITY_ORDER.findIndex(r => r.toLowerCase() === (a.rarity || "").toLowerCase());
          let idxB = RARITY_ORDER.findIndex(r => r.toLowerCase() === (b.rarity || "").toLowerCase());
          return idxB - idxA;
        }
        if (criteria === 'rarity_asc') {
          let idxA = RARITY_ORDER.findIndex(r => r.toLowerCase() === (a.rarity || "").toLowerCase());
          let idxB = RARITY_ORDER.findIndex(r => r.toLowerCase() === (b.rarity || "").toLowerCase());
          return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
        }
        return 0;
      });
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const activeType = document.getElementById('type-select').value;
      const activeName = document.getElementById('name-search').value.toLowerCase().trim();
      
      let filtered = allCards;
      
      if (activeName) filtered = filtered.filter((c) => c.name.toLowerCase().includes(activeName));
      if (activeRarities.size > 0) filtered = filtered.filter((c) => activeRarities.has(c.rarity));
      if (activeType) filtered = filtered.filter((c) => (c.types || '').split(',').includes(activeType));

      if (!filtered.length) {
        container.innerHTML = '<div class="state-msg">No cards found for this filter.</div>';
        return;
      }

      const currentCriteria = document.getElementById('sort-select').value;
      filtered = sortCards(filtered, currentCriteria);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';
      filtered.forEach((c) => {
        let targetPrice = c.price_market;
        let targetCurrency = c.currency;
        if (targetPrice !== null && targetCurrency === 'USD') {
          targetPrice = targetPrice * usdToEurRate;
          targetCurrency = 'EUR';
        }

        const priceLabel = formatPrice(targetPrice, targetCurrency);
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.id = `card-${c.id}`;
        const bigImgUrl = c.image_large || c.image_small || '';
        
        tile.onclick = () => window.openGlobalCardModal(c, bigImgUrl, priceLabel || 'n/a', c.rarity);

        tile.innerHTML = `
          <button class="collect-btn ${c.is_owned ? 'owned' : ''}" onclick="event.stopPropagation(); toggleOwn('${c.id}', this)">★</button>
          <button class="wish-btn ${c.is_wished ? 'wished' : ''}" onclick="event.stopPropagation(); toggleWish('${c.id}', this)">❤️</button>
          <img src="${escapeHtml(c.image_large || c.image_small || '')}" alt="${escapeHtml(c.name)}" loading="lazy" onerror="this.src='${escapeHtml(c.image_small || '')}'">
          <div class="price-tag ${priceLabel ? '' : 'no-price'}">${priceLabel || 'n/a'}</div>
          <div class="card-info">
            <div class="card-name">${escapeHtml(c.name)}${c.card_number ? ' · #' + escapeHtml(c.card_number) : ''}</div>
            <div class="card-rarity">${escapeHtml(c.rarity || 'Unknown rarity')}</div>
          </div>
        `;
        grid.appendChild(tile);
      });
      container.innerHTML = '';
      container.appendChild(grid);

      if (!window.hasScrolledToFocus) {
          const focusId = new URLSearchParams(window.location.search).get('focus');
          if (focusId) {
              setTimeout(() => {
                  const target = document.getElementById('card-' + focusId);
                  if (target) {
                      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                      target.style.transition = 'box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease';
                      target.style.boxShadow = '0 0 30px var(--teal)';
                      target.style.borderColor = 'var(--teal)';
                      target.style.transform = 'scale(1.03)';
                      
                      setTimeout(() => {
                          target.style.boxShadow = '';
                          target.style.borderColor = '';
                          target.style.transform = '';
                      }, 2500); 
                  }
              }, 400); 
              window.hasScrolledToFocus = true;
          }
      }
    }

    function populateTypeSelect(cards) {
      const select = document.getElementById('type-select');
      const currentSelected = select.value;
      const typeSet = new Set();
      cards.forEach((c) => (c.types || '').split(',').forEach((t) => { t = t.trim(); if (t) typeSet.add(t); }));
      const sortedTypes = [...typeSet].sort();
      select.innerHTML = '<option value="">-- Any Type --</option>';
      sortedTypes.forEach((t) => {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        if (t === currentSelected) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function applyData(data) {
      if (data.set) {
        document.getElementById('set-name').textContent = data.set.name;
        document.getElementById('set-series').textContent = [data.set.series, data.set.release_date].filter(Boolean).join(' · ');
      }
      allCards = data.cards;
      populateTypeSelect(allCards);
      const sortedRarities = (data.available_rarities || []).sort((a, b) => {
        let indexA = RARITY_ORDER.findIndex(r => r.toLowerCase() === a.toLowerCase());
        let indexB = RARITY_ORDER.findIndex(r => r.toLowerCase() === b.toLowerCase());
        if (indexA === -1) indexA = 99;
        if (indexB === -1) indexB = 99;
        return indexA - indexB;
      });
      renderFilters(sortedRarities);
      renderCards();
      setPageThemeFromCards(allCards);
    }

    async function loadCards() {
      const container = document.getElementById('cards-container');
      try {
        const data = await api(`/api/sets/${encodeURIComponent(setId)}/cards`);
        applyData(data);
      } catch (err) { container.innerHTML = `<div class="state-msg error">Error: ${err.message}</div>`; }
    }

    document.getElementById('sort-select').addEventListener('change', renderCards);
    document.getElementById('type-select').addEventListener('change', renderCards);
    document.getElementById('name-search').addEventListener('input', renderCards);
    document.getElementById('about-btn').addEventListener('click', showAboutModal);

    function initAdminSetSync(user) {
      const btn = document.getElementById('admin-refresh-set-btn');
      if (!user || !user.is_admin) return;
      btn.style.display = 'inline-flex';
      
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = '🔄 Fetching...';
        try {
          const data = await api(`/api/sets/${encodeURIComponent(setId)}/refresh`, { method: 'POST' });
          applyData(data);
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = '🔄 Refresh Set';
        }
      });
    }

    async function toggleOwn(cardId, btn) {
      try {
        const res = await api('/api/collection/toggle', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ card_id: cardId })
        });
        if (res.is_owned) btn.classList.add('owned'); else btn.classList.remove('owned');
        const card = allCards.find(c => c.id === cardId);
        if (card) card.is_owned = res.is_owned;
      } catch (err) { alert(err.message); }
    }

    async function toggleWish(cardId, btn) {
      try {
        const res = await api('/api/wishlist/toggle', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ card_id: cardId })
        });
        if (res.is_wished) btn.classList.add('wished'); else btn.classList.remove('wished');
        const card = allCards.find(c => c.id === cardId);
        if (card) card.is_wished = res.is_wished;
      } catch (err) { alert(err.message); }
    }

    requireAuth().then(async user => { 
      if (user) { 
        await loadExchangeRate();
        loadCards(); 
        initAdminSetSync(user);
      } 
    });
  </script>
</body>
</html>
