<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokyudex — Wishlist</title>
  <link rel="stylesheet" href="style.css" />
  <style>:root { --dot-color: #4f8bf9; }</style>
  <style>
    .stats-panel { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .stat-card { background: var(--panel); border: 1px solid var(--border); padding: 16px 24px; border-radius: var(--radius); flex: 1; min-width: 200px; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--danger); font-weight: 700; margin-top: 4px; }
    .controls-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    
    .board-tile.dragging, .card-tile.dragging { opacity: 0.4; }
    .board-tile.drag-over { border-color: var(--gold) !important; box-shadow: 0 0 15px rgba(240, 185, 61, 0.4); }

    .search-overlay { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(10,9,14,0.97); 
      z-index: 1100; 
      padding: 40px; 
      overflow-y: auto; 
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="side-menu-trigger">
        <button class="hamburger-btn" aria-label="Menu">☰</button>
        <div class="side-menu-panel">
          <a href="binder.html" class="side-menu-link">📁 Binders</a>
          <a href="wishlist.html" class="side-menu-link">❤️ Wishlist</a>
          <a href="collezione.html" class="side-menu-link">★ My Collection</a>
        </div>
      </div>
      <a href="index.html" class="icon-btn" aria-label="Home" title="Home">🏠</a>
      <a href="index.html" class="brand"><span class="dot"></span> Pokyudex</a>
    </div>
    <div class="topbar-right">
      <span id="current-username" class="user-badge"></span>
      <button class="btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="eyebrow">Your Budget</div>
    <h1>Wishlist</h1>

    <div class="stats-panel">
      <div class="stat-card">
        <div class="eyebrow" style="margin:0;">Wanted Cards</div>
        <div class="stat-val" id="total-cards" style="color: var(--teal);">0</div>
      </div>
      <div class="stat-card">
        <div class="eyebrow" style="margin:0;">Estimated Cost (EUR)</div>
        <div class="stat-val" id="total-val-eur">0.00 €</div>
      </div>
    </div>

    <div id="boards-section" style="padding: 14px 6px 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);">
      <div class="section-title">Your Boards</div>
      <div class="boards-grid" id="boards-grid"></div>
    </div>

    <div id="board-detail-view" style="display:none;">
  <div class="binder-header" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px;">
    <div style="flex: 1; min-width: 200px;">
      <button class="btn" onclick="closeBoardDetail()" style="margin-bottom:10px;">&larr; All Boards</button><br>
      <h2 id="board-detail-title" style="margin:0; font-family:'Rajdhani'; font-size:28px;"></h2>
    </div>
    
    <div style="display:flex; gap: 12px; align-items: center;">
      <button class="btn btn-accent" onclick="openAddToBoardOverlay()">+ Add Cards</button>
      <button class="btn" style="border-color:var(--danger); color:var(--danger);" onclick="deleteCurrentBoard()">Delete Board</button>
    </div>
  </div>

  <div class="controls-row" style="justify-content: flex-end;">
    <select id="board-sort-select" class="search-bar" style="margin-top: 0; width: auto; min-width: 260px; height: 41px; padding: 0 14px;">
      <option value="manual">Custom Order</option>
      <option value="price_desc">Price: highest first</option>
      <option value="price_asc">Price: lowest first</option>
      <option value="rarity_desc">Rarity: rarest first</option>
      <option value="rarity_asc">Rarity: least rare first</option>
      <option value="date_desc">Release date: newest first</option>
      <option value="date_asc">Release date: oldest first</option>
    </select>
  </div>
  
  <div id="board-cards-container">
    <div class="state-msg">No cards in this board yet. Use "+ Add Cards".</div>
  </div>
</div>

    <div id="main-wishlist-section">
      <div class="section-title" style="margin-top: 10px;">Non categorizzate</div>
      <div class="controls-row">
        <select id="sort-select" class="search-bar" style="margin-top: 0; width: auto; min-width: 240px; height: 41px; padding: 0 14px;">
          <option value="price_desc">Price: highest first</option>
          <option value="price_asc">Price: lowest first</option>
          <option value="rarity_desc">Rarity: rarest first</option>
          <option value="rarity_asc">Rarity: least rare first</option>
          <option value="date_desc">Release date: newest first</option>
          <option value="date_asc">Release date: oldest first</option>
        </select>
      </div>
      <div id="wishlist-container">
        <div class="state-msg"><span class="spinner"></span>Opening your wishlist...</div>
      </div>
    </div>
  </div>

  <div id="new-board-modal" class="modal" onclick="closeNewBoardModal()">
    <div class="about-card" onclick="event.stopPropagation()" style="max-width:340px;">
      <button class="modal-close" style="position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--border); font-size:18px;" onclick="closeNewBoardModal()">&times;</button>
      <div class="eyebrow" style="color: var(--gold);">New Board</div>
      <div class="form-group" style="width:100%; margin:14px 0;">
        <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; margin-bottom:6px;">Name</label>
        <input type="text" id="new-board-name" placeholder="E.g. Pink cards" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);" />
      </div>
      <div class="form-group" style="margin:0 0 20px;">
        <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; margin-bottom:6px;">Color</label>
        <input type="color" id="new-board-color" value="#a855f7" style="width: 70px; padding:2px; height:37px;" />
      </div>
      <button class="btn btn-accent" style="width:100%;" onclick="createBoard()">Create Board</button>
    </div>
  </div>

  <div id="edit-board-modal" class="modal" onclick="closeEditBoardModal()">
    <div class="about-card" onclick="event.stopPropagation()" style="max-width:340px;">
      <button class="modal-close" style="position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--border); font-size:18px;" onclick="closeEditBoardModal()">&times;</button>
      <div class="eyebrow" style="color: var(--gold);">Edit Board</div>
      <div class="form-group" style="width:100%; margin:14px 0;">
        <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; margin-bottom:6px;">Name</label>
        <input type="text" id="edit-board-name" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);" />
      </div>
      <div class="form-group" style="margin:0 0 20px;">
        <label style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted); display:block; margin-bottom:6px;">Color</label>
        <input type="color" id="edit-board-color" style="width: 70px; padding:2px; height:37px;" />
      </div>
      <button class="btn btn-accent" style="width:100%;" onclick="saveEditBoard()">Save</button>
    </div>
  </div>

  <div id="add-to-board-overlay" class="search-overlay">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Add Cards to "<span id="add-to-board-title"></span>"</h2>
        <button class="btn" onclick="closeAddToBoardOverlay()">Close</button>
      </div>
      <div style="display: flex; justify-content: flex-start; margin-bottom: 20px; gap: 10px; align-items: center;">
        <span style="font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-muted);">Sort by:</span>
        <select id="overlay-sort-select" class="search-bar" style="margin-top: 0; width: auto; min-width: 240px; height: 41px; padding: 0 14px;">
          <option value="price_desc">Price: highest first</option>
          <option value="price_asc">Price: lowest first</option>
          <option value="rarity_desc">Rarity: rarest first</option>
          <option value="rarity_asc">Rarity: least rare first</option>
          <option value="date_desc">Release date: newest first</option>
          <option value="date_asc">Release date: oldest first</option>
        </select>
      </div>
      <div id="add-to-board-container"></div>
    </div>
  </div>

  <div id="card-modal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modal-img" src="" alt="Zoom" />
  </div>

  <script src="app.js"></script>
  <script>
    renderBloomLayer([
      { h: 271, s: 78, l: 62 },
      { h: 300, s: 68, l: 60 },
      { h: 250, s: 62, l: 55 },
    ]);

    let wishlist = [];          
    let uncategorized = [];     
    let boards = [];            
    let currentBoardCards = []; 
    let currentBoardId = null;
    let editingBoardId = null;
    let boardSortCriteria = 'manual';
    let usdToEurRate = 0.92;

    const RARITY_ORDER = [
      "Common", "Uncommon", "Promo", "Classic Collection", "Rare", "Rare Holo", "Rare BREAK",
      "Rare Holo EX", "Rare Holo GX", "Rare Holo LV.X", "Rare Holo V", "Rare Holo VMAX",
      "Rare Holo VSTAR", "Double Rare", "Ultra Rare", "Amazing Rare", "Radiant Rare",
      "Illustration Rare", "Special Illustration Rare", "MEGA_ATTACK_RARE", "Mega Attack Rare",
      "Mega Hyper Rare", "Trainer Gallery Rare Holo", "Shiny Rare", "Shiny Ultra Rare",
      "ACE SPEC Rare", "Black White Rare", "Rare Secret", "Secret Rare", "Rare Rainbow", "Hyper Rare"
    ];

    async function loadExchangeRate() {
      try {
        const data = await api('/api/exchange-rate');
        usdToEurRate = data.usd_to_eur;
      } catch (err) { console.error('Unable to load exchange rate:', err); }
    }

    function calculateStats(cards) {
      document.getElementById('total-cards').textContent = cards.length;
      let totalEur = 0;
      cards.forEach(c => {
        if (c.price_market == null) return;
        if (c.currency === 'EUR') totalEur += c.price_market;
        else if (c.currency === 'USD') totalEur += c.price_market * usdToEurRate;
      });
      document.getElementById('total-val-eur').textContent = totalEur.toFixed(2) + ' €';
    }

    function sortCards(cardsArray, criteria) {
      return [...cardsArray].sort((a, b) => {
        if (criteria === 'price_desc') return (b.price_market ?? -1) - (a.price_market ?? -1);
        if (criteria === 'price_asc') return (a.price_market ?? Infinity) - (b.price_market ?? Infinity);
        if (criteria === 'rarity_desc') {
          let idxA = RARITY_ORDER.findIndex(r => r.toLowerCase() === (a.rarity || "").toLowerCase());
          let idxB = RARITY_ORDER.findIndex(r => r.toLowerCase() === (b.rarity || "").toLowerCase());
          return idxB - idxA;
        }
        if (criteria === 'rarity_asc') {
          let idxA = RARITY_ORDER.findIndex(r => r.toLowerCase() === (a.rarity || "").toLowerCase());
          let idxB = RARITY_ORDER.findIndex(r => r.toLowerCase() === (b.rarity || "").toLowerCase());
          return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
        }
        if (criteria === 'date_desc') return (b.release_date || "").localeCompare(a.release_date || "");
        if (criteria === 'date_asc') return (a.release_date || "").localeCompare(b.release_date || "");
        return 0;
      });
    }

    function renderWishlist() {
      const container = document.getElementById('wishlist-container');
      if (!uncategorized.length) {
        container.innerHTML = '<div class="state-msg">No cards saved in your Wishlist yet. Search for cards on the Home page and add them with ❤️.</div>';
        return;
      }

      const currentCriteria = document.getElementById('sort-select').value;
      const sorted = sortCards(uncategorized, currentCriteria);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';
      sorted.forEach((c) => {
        const priceLabel = formatPrice(c.price_market, c.currency);
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.draggable = true;
        tile.dataset.cardId = c.id;
        const bigImgUrl = c.image_large || c.image_small || '';
        tile.onclick = (e) => {
          if (tile.classList.contains('dragging-suppress-click')) { tile.classList.remove('dragging-suppress-click'); return; }
          openModal(bigImgUrl);
        };

        tile.innerHTML = `
          <button class="wish-btn wished" onclick="event.stopPropagation(); removeCard('${c.id}')">❤️</button>
          <img src="${escapeHtml(c.image_large || c.image_small || '')}" alt="${escapeHtml(c.name)}" loading="lazy" onerror="this.src='${escapeHtml(c.image_small || '')}'">
          <div class="price-tag ${priceLabel ? '' : 'no-price'}">${priceLabel || 'n/a'}</div>
          <div class="card-info">
            <div class="card-name">${escapeHtml(c.name)}${c.card_number ? ' · #' + escapeHtml(c.card_number) : ''}</div>
            <div class="card-rarity" style="color: var(--teal); font-weight:600; margin-bottom:2px;">${escapeHtml(c.set_name)}</div>
            <div class="card-rarity">${escapeHtml(c.rarity || 'Unknown rarity')}</div>
          </div>
        `;

        tile.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', c.id);
          window.draggedWishlistCardId = c.id;
        });
        tile.addEventListener('dragend', () => { tile.classList.add('dragging-suppress-click'); });

        grid.appendChild(tile);
      });
      container.innerHTML = '';
      container.appendChild(grid);
    }

    async function loadWishlist() {
      try {
        wishlist = await api('/api/wishlist');
        calculateStats(wishlist);
      } catch (err) {
        document.getElementById('wishlist-container').innerHTML = `<div class="state-msg error">Error: ${err.message}</div>`;
        return;
      }
      await loadUncategorized();
    }

    async function loadUncategorized() {
      try {
        uncategorized = await api('/api/wishlist/uncategorized');
        renderWishlist();
      } catch (err) {
        document.getElementById('wishlist-container').innerHTML = `<div class="state-msg error">Error: ${err.message}</div>`;
      }
    }

    async function removeCard(cardId) {
      try {
        await api('/api/wishlist/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ card_id: cardId })
        });
        wishlist = wishlist.filter(c => c.id !== cardId);
        uncategorized = uncategorized.filter(c => c.id !== cardId);
        calculateStats(wishlist);
        renderWishlist();
      } catch (err) { alert(err.message); }
    }

    document.getElementById('sort-select').addEventListener('change', renderWishlist);

    function openModal(imgUrl) {
      if (!imgUrl) return;
      document.getElementById('card-modal').style.display = "flex";
      document.getElementById('modal-img').src = imgUrl;
    }
    if (typeof closeModal === 'undefined') {
      window.closeModal = function() { document.getElementById('card-modal').style.display = "none"; }
    }

    async function loadBoards() {
      try {
        boards = await api('/api/wishlist/boards');
        renderBoardsGrid();
      } catch (err) { console.error('Error loading boards:', err); }
    }

    // MODIFICA: Sostituito il cestino (🗑) con una X rossa (❌) nelle azioni della copertina
    function renderBoardsGrid() {
      const grid = document.getElementById('boards-grid');
      grid.innerHTML = '';

      boards.forEach(b => {
        const tile = document.createElement('div');
        tile.className = 'board-tile';
        tile.draggable = true;
        tile.dataset.boardId = b.id;
        tile.style.background = `linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.55) 100%), ${b.color}`;
        tile.onclick = () => {
          if (tile.classList.contains('dragging-suppress-click')) { tile.classList.remove('dragging-suppress-click'); return; }
          openBoardDetail(b.id);
        };
        tile.innerHTML = `
          <div class="board-tile-actions">
            <button title="Edit" onclick="event.stopPropagation(); openEditBoardModal(${b.id})">✎</button>
            <button title="Delete" onclick="event.stopPropagation(); deleteBoardById(${b.id})">❌</button>
          </div>
          <div class="board-tile-name">${escapeHtml(b.name)}</div>
          <div class="board-tile-count">${b.card_count} cart${b.card_count === 1 ? 'a' : 'e'}</div>
        `;

        tile.addEventListener('dragstart', (e) => {
          window.draggedBoardId = b.id;
          tile.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        tile.addEventListener('dragend', () => {
          tile.classList.remove('dragging');
          tile.classList.add('dragging-suppress-click');
          window.draggedBoardId = undefined;
        });
        tile.addEventListener('dragover', (e) => {
          e.preventDefault();
          tile.classList.add('drag-over');
        });
        tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
        tile.addEventListener('drop', async (e) => {
          e.preventDefault();
          tile.classList.remove('drag-over');
          
          const cardId = e.dataTransfer.getData('text/plain') || window.draggedWishlistCardId;
          if (cardId && window.draggedBoardId === undefined) {
            try {
              await api(`/api/wishlist/boards/${b.id}/cards`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ card_id: cardId })
              });
              await loadWishlist();
              await loadBoards();
            } catch (err) { alert(err.message); }
            return;
          }

          const draggedId = window.draggedBoardId;
          const targetId = b.id;
          if (draggedId && draggedId !== targetId) {
            reorderBoardsAction(draggedId, targetId);
          }
        });

        grid.appendChild(tile);
      });

      const newTile = document.createElement('div');
      newTile.className = 'board-tile new-board-tile';
      newTile.textContent = '+ New Board';
      newTile.onclick = openNewBoardModal;
      grid.appendChild(newTile);
    }

    let boardsReorderDebounce;
    function reorderBoardsAction(draggedId, targetId) {
      const fromIdx = boards.findIndex(x => x.id === draggedId);
      const toIdx = boards.findIndex(x => x.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return;

      const [moved] = boards.splice(fromIdx, 1);
      boards.splice(toIdx, 0, moved);

      renderBoardsGrid();

      clearTimeout(boardsReorderDebounce);
      boardsReorderDebounce = setTimeout(async () => {
        try {
          await api('/api/wishlist/boards/reorder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ board_ids: boards.map(x => x.id) })
          });
        } catch (err) { console.error(err); }
      }, 400);
    }

    function openNewBoardModal() {
      document.getElementById('new-board-name').value = '';
      document.getElementById('new-board-color').value = '#a855f7';
      document.getElementById('new-board-modal').style.display = 'flex';
    }
    function closeNewBoardModal() { document.getElementById('new-board-modal').style.display = 'none'; }

    async function createBoard() {
      const name = document.getElementById('new-board-name').value.trim();
      const color = document.getElementById('new-board-color').value;
      if (!name) { alert('Enter a name for the board.'); return; }
      try {
        await api('/api/wishlist/boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color })
        });
        closeNewBoardModal();
        loadBoards();
      } catch (err) { alert(err.message); }
    }

    function openEditBoardModal(boardId) {
      const b = boards.find(x => x.id === boardId);
      if (!b) return;
      editingBoardId = boardId;
      document.getElementById('edit-board-name').value = b.name;
      document.getElementById('edit-board-color').value = b.color;
      document.getElementById('edit-board-modal').style.display = 'flex';
    }
    function closeEditBoardModal() { document.getElementById('edit-board-modal').style.display = 'none'; }

    async function saveEditBoard() {
      const name = document.getElementById('edit-board-name').value.trim();
      const color = document.getElementById('edit-board-color').value;
      if (!name) { alert('Name cannot be empty.'); return; }
      try {
        await api(`/api/wishlist/boards/${editingBoardId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color })
        });
        closeEditBoardModal();
        await loadBoards();
        if (currentBoardId === editingBoardId) {
          document.getElementById('board-detail-title').textContent = name;
        }
      } catch (err) { alert(err.message); }
    }

    async function deleteBoardById(boardId) {
      if (!confirm('Delete this board?')) return;
      try {
        await api(`/api/wishlist/boards/${boardId}`, { method: 'DELETE' });
        await loadBoards();
        await loadUncategorized();
      } catch (err) { alert(err.message); }
    }

    async function deleteCurrentBoard() {
      if (!confirm('Delete this board?')) return;
      try {
        await api(`/api/wishlist/boards/${currentBoardId}`, { method: 'DELETE' });
        closeBoardDetail();
        await loadBoards();
        await loadUncategorized();
      } catch (err) { alert(err.message); }
    }

    async function openBoardDetail(boardId) {
      currentBinderId = null;
      currentBoardId = boardId;
      boardSortCriteria = 'manual';
      document.getElementById('board-sort-select').value = 'manual';
      document.getElementById('boards-section').style.display = 'none';
      document.getElementById('main-wishlist-section').style.display = 'none';
      document.getElementById('board-detail-view').style.display = 'block';
      await renderBoardDetail();
    }

    document.getElementById('board-sort-select').addEventListener('change', (e) => {
      boardSortCriteria = e.target.value;
      renderBoardCardsGrid();
    });

    function closeBoardDetail() {
      currentBoardId = null;
      closeAddToBoardOverlay(); 
      document.getElementById('board-detail-view').style.display = 'none';
      document.getElementById('boards-section').style.display = 'block';
      document.getElementById('main-wishlist-section').style.display = 'block';
    }

    async function renderBoardDetail() {
      const container = document.getElementById('board-cards-container');
      container.innerHTML = '<div class="state-msg"><span class="spinner"></span>Loading...</div>';
      try {
        const data = await api(`/api/wishlist/boards/${currentBoardId}`);
        document.getElementById('board-detail-title').textContent = data.board.name;
        document.getElementById('board-detail-title').style.borderBottom = `3px solid ${data.board.color}`;
        currentBoardCards = data.cards;

        renderBoardCardsGrid();
      } catch (err) {
        container.innerHTML = `<div class="state-msg error">Error: ${err.message}</div>`;
      }
    }

    function renderBoardCardsGrid() {
      const container = document.getElementById('board-cards-container');
      if (!currentBoardCards.length) {
        container.innerHTML = '<div class="state-msg">No cards in this board yet. Use "+ Add Cards".</div>';
        return;
      }

      const isManualOrder = boardSortCriteria === 'manual';
      const displayCards = isManualOrder ? currentBoardCards : sortCards(currentBoardCards, boardSortCriteria);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';
      displayCards.forEach((c) => {
        const priceLabel = formatPrice(c.price_market, c.currency);
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.draggable = isManualOrder;
        tile.dataset.cardId = c.id;
        tile.onclick = () => {
          if (tile.classList.contains('dragging-suppress-click')) { tile.classList.remove('dragging-suppress-click'); return; }
          openModal(c.image_large || c.image_small || '');
        };
        tile.innerHTML = `
          <button class="card-tile-small-remove" title="Remove from board" onclick="event.stopPropagation(); removeCardFromCurrentBoard('${c.id}')">✕</button>
          <img src="${escapeHtml(c.image_large || c.image_small || '')}" alt="${escapeHtml(c.name)}" loading="lazy" onerror="this.src='${escapeHtml(c.image_small || '')}'">
          <div class="price-tag ${priceLabel ? '' : 'no-price'}">${priceLabel || 'n/a'}</div>
          <div class="card-info">
            <div class="card-name">${escapeHtml(c.name)}${c.card_number ? ' · #' + escapeHtml(c.card_number) : ''}</div>
            <div class="card-rarity" style="color: var(--teal); font-weight:600; margin-bottom:2px;">${escapeHtml(c.set_name)}</div>
            <div class="card-rarity">${escapeHtml(c.rarity || 'Unknown rarity')}</div>
          </div>
        `;

        if (isManualOrder) {
          tile.addEventListener('dragstart', (e) => {
            window.draggedBoardCardId = c.id;
            tile.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          tile.addEventListener('dragend', () => {
            tile.classList.remove('dragging');
            tile.classList.add('dragging-suppress-click');
            window.draggedBoardCardId = undefined;
          });
          tile.addEventListener('dragover', (e) => {
            if (window.draggedBoardCardId === undefined) return;
            e.preventDefault();
            tile.style.borderColor = 'var(--gold)';
          });
          tile.addEventListener('dragleave', () => { tile.style.borderColor = ''; });
          tile.addEventListener('drop', (e) => {
            e.preventDefault();
            tile.style.borderColor = '';
            const draggedCardId = window.draggedBoardCardId;
            const targetCardId = c.id;
            if (draggedCardId && draggedCardId !== targetCardId) {
              reorderBoardCardsAction(draggedCardId, targetCardId);
            }
          });
        }

        grid.appendChild(tile);
      });
      container.innerHTML = '';
      container.appendChild(grid);
    }

    let boardCardsReorderDebounce;
    function reorderBoardCardsAction(draggedCardId, targetCardId) {
      const fromIdx = currentBoardCards.findIndex(x => x.id === draggedCardId);
      const toIdx = currentBoardCards.findIndex(x => x.id === targetCardId);
      if (fromIdx === -1 || toIdx === -1) return;

      const [moved] = currentBoardCards.splice(fromIdx, 1);
      currentBoardCards.splice(toIdx, 0, moved);

      renderBoardCardsGrid();

      clearTimeout(boardCardsReorderDebounce);
      boardCardsReorderDebounce = setTimeout(async () => {
        try {
          await api(`/api/wishlist/boards/${currentBoardId}/cards/reorder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ card_ids: currentBoardCards.map(x => x.id) })
          });
        } catch (err) { console.error(err); }
      }, 400);
    }

    async function removeCardFromCurrentBoard(cardId) {
      try {
        await api(`/api/wishlist/boards/${currentBoardId}/cards/${cardId}`, { method: 'DELETE' });
        await renderBoardDetail();
        await loadWishlist();
        await loadBoards();
      } catch (err) { alert(err.message); }
    }

    function openAddToBoardOverlay() {
      const b = boards.find(x => x.id === currentBoardId);
      document.getElementById('add-to-board-title').textContent = b ? b.name : '';
      renderAddToBoardList();
      document.getElementById('add-to-board-overlay').style.display = 'block';
    }
    function closeAddToBoardOverlay() {
      document.getElementById('add-to-board-overlay').style.display = 'none';
    }

    function renderAddToBoardList() {
      const container = document.getElementById('add-to-board-container');
      if (!uncategorized.length) {
        container.innerHTML = '<div class="state-msg">You don\'t have any wishlist cards to add. Add new ones to your wishlist from the Home page.</div>';
        return;
      }
      
      const criteria = document.getElementById('overlay-sort-select').value;
      const sorted = sortCards(uncategorized, criteria);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';
      
      let displayedCount = 0; 

      sorted.forEach((c) => {
        const priceLabel = formatPrice(c.price_market, c.currency);
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        
        const isAlreadyInBoard = currentBoardCards.some(x => x.id === c.id);

        if (isAlreadyInBoard) return;

        displayedCount++;

        tile.innerHTML = `
          <button class="add-to-board-btn" title="Add to this board">+</button>
          <img src="${escapeHtml(c.image_large || c.image_small || '')}" alt="${escapeHtml(c.name)}" loading="lazy" onerror="this.src='${escapeHtml(c.image_small || '')}'">
          <div class="price-tag ${priceLabel ? '' : 'no-price'}">${priceLabel || 'n/a'}</div>
          <div class="card-info">
            <div class="card-name">${escapeHtml(c.name)}${c.card_number ? ' · #' + escapeHtml(c.card_number) : ''}</div>
            <div class="card-rarity" style="color: var(--teal); font-weight:600; margin-bottom:2px;">${escapeHtml(c.set_name)}</div>
            <div class="card-rarity">${escapeHtml(c.rarity || 'Unknown rarity')}</div>
          </div>
        `;
        const addBtn = tile.querySelector('.add-to-board-btn');
        addBtn.onclick = async (e) => {
          e.stopPropagation();
          if (addBtn.classList.contains('added')) return;
          try {
            await api(`/api/wishlist/boards/${currentBoardId}/cards`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ card_id: c.id })
            });
            addBtn.classList.add('added');
            addBtn.textContent = '✓';

            if (!currentBoardCards.some(x => x.id === c.id)) {
              currentBoardCards.push(c);
              renderBoardCardsGrid();
            }

            const boardObj = boards.find(x => x.id === currentBoardId);
            if (boardObj) {
              boardObj.card_count++;
              renderBoardsGrid();
            }

            renderAddToBoardList();

          } catch (err) { alert(err.message); }
        };
        grid.appendChild(tile);
      });

      if (displayedCount === 0) {
        container.innerHTML = '<div class="state-msg">All the cards in your wishlist have already been added to this board!</div>';
        return;
      }

      container.innerHTML = '';
      container.appendChild(grid);
    }

    document.getElementById('add-to-board-overlay').addEventListener('click', async (e) => {
      if (e.target.id === 'add-to-board-overlay') {
        closeAddToBoardOverlay();
        await loadWishlist();
        await loadBoards();
        await renderBoardDetail();
      }
    });

    document.getElementById('overlay-sort-select').addEventListener('change', renderAddToBoardList);

    let dragScrollTimer = null;

    document.addEventListener('dragover', (e) => {
      const topBoundary = 100;
      const bottomBoundary = window.innerHeight - 100;

      clearInterval(dragScrollTimer);
      dragScrollTimer = null;

      if (e.clientY < topBoundary) {
        dragScrollTimer = setInterval(() => {
          window.scrollBy(0, -14); 
        }, 16);
      } 
      else if (e.clientY > bottomBoundary) {
        dragScrollTimer = setInterval(() => {
          window.scrollBy(0, 14); 
        }, 16);
      }
    });

    document.addEventListener('dragend', () => { clearInterval(dragScrollTimer); });
    document.addEventListener('drop', () => { clearInterval(dragScrollTimer); });

    requireAuth().then(async (user) => {
      if (!user) return;
      await loadExchangeRate();
      await loadBoards();
      await loadWishlist();
    });
  </script>
</body>
</html>
